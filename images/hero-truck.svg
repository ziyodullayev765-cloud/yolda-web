<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Zamonaviy va chiroyli yuk mashinasi SVG kodi -->
  <defs>
    <!-- Kabina uchun qizil metallik gradienti -->
    <linearGradient id="cabinGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <!-- Oyna uchun gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8dadc"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
    <!-- G'ildirak disklari uchun xrom gradient -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>
    <!-- Mashina tagidagi soya effekti -->
    <filter id="shadowBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <!-- 1. Mashina tagidagi soya -->
  <ellipse cx="430" cy="335" rx="340" ry="15" fill="#1d1d1d" opacity="0.6" filter="url(#shadowBlur)"/>

  <!-- YUK MASHINASI ASOSIY QISMI -->
  <!-- 2. Orqa katta yukxona (Konteyner) -->
  <rect x="260" y="90" width="460" height="200" rx="10" fill="#f1faee" stroke="#e1e8ed" stroke-width="4"/>
  <!-- Konteyner ustidagi chiziqlar (Dizayn) -->
  <line x1="260" y1="140" x2="720" y2="140" stroke="#e63946" stroke-width="6"/>
  <line x1="260" y1="160" x2="720" y2="160" stroke="#1d3557" stroke-width="4"/>
  <text x="490" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#1d3557" text-anchor="middle" letter-spacing="4">YOLDA LOGISTICS</text>

  <!-- 3. Shassi (Pastki qora rama) -->
  <rect x="120" y="280" width="580" height="30" rx="5" fill="#1d3557"/>
  <!-- Old bamper -->
  <path d="M 80 270 L 120 270 L 120 310 L 90 310 Z" fill="#2b2d42"/>

  <!-- 4. Kabina (Haydovchi qismi) -->
  <!-- Tom qismidagi aerodinamik spoyler -->
  <path d="M 120 120 Q 180 90 250 95 L 250 130 L 120 130 Z" fill="url(#cabinGrad)"/>
  <!-- Asosiy kabina korpusi -->
  <path d="M 90 270 L 100 130 L 250 130 L 250 280 L 90 280 Z" fill="url(#cabinGrad)"/>
  
  <!-- 5. Oynalar -->
  <!-- Old oyna -->
  <path d="M 105 200 L 112 145 L 175 145 L 170 200 Z" fill="url(#glassGrad)"/>
  <!-- Yon oyna -->
  <path d="M 180 145 L 240 145 L 240 200 L 175 200 Z" fill="url(#glassGrad)"/>

  <!-- 6. Radiator panjarasi va Fara -->
  <rect x="85" y="210" width="10" height="50" rx="2" fill="#bdc3c7"/>
  <!-- LED Fara (Yorug'lik effekti bilan) -->
  <polygon points="85,250 95,250 95,265 85,260" fill="#fff"/>
  <circle cx="90" cy="257" r="4" fill="#00f0ff"/>

  <!-- 7. G'ILDIRAKLAR (Mukammal va batafsil chizilgan) -->
  <!-- Old g'ildirak -->
  <g transform="translate(160, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 6"/>
  </g>

  <!-- Orqa g'ildiraklar (Ikkitalik o'q) -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
  <g transform="translate(415, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>

  <!-- Eng orqa g'ildiraklar -->
  <g transform="translate(610, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
  <g transform="translate(685, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
</svg>
