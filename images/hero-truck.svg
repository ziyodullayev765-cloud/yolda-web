<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Очищенный SVG без конфликтующих фильтров для идеального превью на GitHub -->
  <defs>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8dadc"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>
  </defs>

  <!-- Простая полупрозрачная тень под машиной (без фильтра размытия) -->
  <ellipse cx="430" cy="335" rx="340" ry="12" fill="#111111" opacity="0.4"/>

  <!-- КОРПУС И ПРИЦЕП -->
  <!-- Задний грузовой контейнер -->
  <rect x="260" y="90" width="460" height="200" rx="10" fill="#f1faee" stroke="#e1e8ed" stroke-width="4"/>
  <!-- Декоративные полосы на прицепе -->
  <rect x="260" y="140" width="460" height="8" fill="#e63946"/>
  <rect x="260" y="154" width="460" height="5" fill="#1d3557"/>
  
  <!-- Логотип (стандартный шрифт Arial для совместимости с GitHub) -->
  <text x="490" y="215" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#1d3557" text-anchor="middle" letter-spacing="4">YOLDA LOGISTICS</text>

  <!-- Нижняя рама (Шасси) -->
  <rect x="120" y="280" width="580" height="30" rx="5" fill="#1d3557"/>
  <!-- Передний нижний бампер -->
  <path d="M 80 270 L 120 270 L 120 310 L 90 310 Z" fill="#2b2d42"/>

  <!-- КАБИНА ТЯГАЧА -->
  <!-- Обтекатель спойлера -->
  <path d="M 120 120 Q 180 90 250 95 L 250 130 L 120 130 Z" fill="url(#cGrad)"/>
  <!-- Основная кабина -->
  <path d="M 90 270 L 100 130 L 250 130 L 250 280 L 90 280 Z" fill="url(#cGrad)"/>
  
  <!-- Тонированные стекла -->
  <path d="M 105 200 L 112 145 L 175 145 L 170 200 Z" fill="url(#gGrad)"/>
  <path d="M 180 145 L 240 145 L 240 200 L 175 200 Z" fill="url(#gGrad)"/>

  <!-- Решетка и Фары -->
  <rect x="85" y="210" width="10" height="50" rx="2" fill="#bdc3c7"/>
  <polygon points="85,250 95,250 95,265 85,260" fill="#ffffff"/>
  <circle cx="90" cy="257" r="4" fill="#00f0ff"/>

  <!-- КОЛЕСА -->
  <!-- Переднее колесо -->
  <g transform="translate(160, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>

  <!-- Задняя сдвоенная ось -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
  <g transform="translate(415, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>

  <!-- Оси полуприцепа -->
  <g transform="translate(610, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
  <g transform="translate(685, 310)">
    <circle cx="0" cy="0" r="38" fill="#1d1d1d" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="url(#chGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#2b2d42"/>
  </g>
</svg>
