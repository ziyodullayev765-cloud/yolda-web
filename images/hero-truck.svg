<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Оптимизированный футуристичный дизайн грузовика для GitHub Preview -->
  <defs>
    <!-- Элегантный темно-синий градиент кузова -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Градиент для светящейся неоновой полосы -->
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Хромированные диски колес -->
    <linearGradient id="wheelHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Естественная плоская тень под грузовиком -->
  <ellipse cx="400" cy="330" rx="360" ry="10" fill="#020617" opacity="0.3"/>

  <!-- КОРПУС И ОБТЕКАЕМЫЙ ПРИЦЕП -->
  <!-- Основной грузовой отсек (Aero Premium) -->
  <path d="M 220 90 L 720 90 Q 740 90 740 110 L 740 280 Q 740 290 730 290 L 220 290 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- Декоративная неоновая линия вдоль всего кузова -->
  <path d="M 100 240 L 740 240" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Текст логотипа (Использует стандартный безопасный шрифт) -->
  <text x="480" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="6">YOLDA</text>
  <text x="480" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="4">NEXT-GEN LOGISTICS</text>

  <!-- НИЖНЯЯ ПЛАТФОРМА (ШАССИ) -->
  <path d="M 80 290 L 720 290 L 710 315 L 90 315 Z" fill="#1e293b"/>

  <!-- АЭРОДИНАМИЧЕСКАЯ КАБИНА ЭЛЕКТРОТЯГАЧА -->
  <!-- Лобовое стекло переходящее в крышу -->
  <path d="M 60 260 L 95 120 Q 140 90 220 90 L 220 290 L 75 290 Z" fill="url(#bodyGrad)"/>
  
  <!-- Панорамное боковое стекло (Глянцевый неон) -->
  <path d="M 100 135 L 140 135 L 160 200 L 95 200 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 148 135 L 205 135 L 205 200 L 168 200 Z" fill="#38bdf8" opacity="0.9"/>

  <!-- Тонкая футуристичная LED-фара -->
  <path d="M 62 250 Q 75 255 85 245" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="247" r="3" fill="#38bdf8"/>

  <!-- МИНИМАЛИСТИЧНЫЕ КОЛЕСА -->
  <!-- Передняя ось -->
  <g transform="translate(140, 315)">
    <circle cx="0" cy="0" r="35" fill="#0f172a"/>
    <circle cx="0" cy="0" r="18" fill="url(#wheelHub)"/>
    <circle cx="0" cy="0" r="8" fill="#475569"/>
  </g>

  <!-- Задняя ось тягача -->
  <g transform="translate(260, 315)">
    <circle cx="0" cy="0" r="35" fill="#0f172a"/>
    <circle cx="0" cy="0" r="18" fill="url(#wheelHub)"/>
    <circle cx="0" cy="0" r="8" fill="#475569"/>
  </g>

  <!-- Двойная ось полуприцепа -->
  <g transform="translate(600, 315)">
    <circle cx="0" cy="0" r="35" fill="#0f172a"/>
    <circle cx="0" cy="0" r="18" fill="url(#wheelHub)"/>
    <circle cx="0" cy="0" r="8" fill="#475569"/>
  </g>
  <g transform="translate(675, 315)">
    <circle cx="0" cy="0" r="35" fill="#0f172a"/>
    <circle cx="0" cy="0" r="18" fill="url(#wheelHub)"/>
    <circle cx="0" cy="0" r="8" fill="#475569"/>
  </g>
</svg>
