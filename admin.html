<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>YO'LDA — Admin</title>
<style>
  /* ---------- Login screen (light, deliberately plain) ---------- */
  :root{
    --ink:#0F172A; --ink-soft:#475569; --route:#1D4ED8;
    --border:#E2E8F0; --paper:#F9FAFB; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:-apple-system,'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);}

  .login-wrap{max-width:360px;margin:80px auto;padding:0 20px;}
  .login-wrap[hidden]{display:none;}
  .login-wrap h1{font-size:20px;margin:0 0 6px;letter-spacing:-0.01em;}
  .login-wrap .sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;}
  .login-wrap .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .login-wrap input{
    width:100%;padding:12px 44px 12px 14px;border:1px solid var(--border);border-radius:8px;
    font-size:15px;margin-bottom:12px;background:#fff;color:var(--ink);
  }
  .login-wrap input:focus{outline:none;border-color:var(--route);}
  /* Scoped to the card's direct-child submit button only — a plain
     ".login-wrap button" selector would also (more specifically than
     ".pw-toggle") match the eye-icon button nested inside .pw-field,
     stretching it to width:100% and painting it blue. */
  .login-wrap .card > button{
    padding:12px 20px;border:none;border-radius:8px;background:var(--route);color:#fff;
    font-weight:600;cursor:pointer;font-size:15px;width:100%;
  }
  .login-wrap .card > button:hover{opacity:0.92;}
  .login-wrap .card > button:disabled{opacity:0.5;cursor:not-allowed;}
  .login-wrap .err{color:#DC2626;font-size:13.5px;margin-top:8px;min-height:18px;}
  .pw-field{position:relative;}
  .pw-toggle{
    position:absolute;right:6px;top:6px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;padding:0;cursor:pointer;color:var(--ink-soft);
  }
  .pw-toggle svg{width:19px;height:19px;}

  /* ---------- Admin shell ---------- */
  .admin-shell{
    --bg:#0B1220; --panel:#0F1A2E; --card2:#131F3A; --card-hi:#182648;
    --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
    --text:#E7ECF7; --text-soft:#8B97B3; --text-dim:#5F6C8A;
    --accent:#4F8CFF; --accent-dark:#3D6FE0; --accent-soft:rgba(79,140,255,0.14);
    --ok:#22C55E; --ok-soft:rgba(34,197,94,0.15);
    --warn:#F59E0B; --warn-soft:rgba(245,158,11,0.15);
    --bad:#EF4444; --bad-soft:rgba(239,68,68,0.15);
    --sidebar-w:248px; --sidebar-w-collapsed:72px;
    display:block;min-height:100vh;background:var(--bg);color:var(--text);
    font-size:14px;line-height:1.45;
  }
  .admin-shell[hidden]{display:none;}
  .admin-shell ::selection{background:var(--accent);color:#fff;}

  .admin-sidebar{
    position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:40;
    background:#070C18;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    transition:width 0.18s ease, transform 0.22s ease;
  }
  .sb-head{
    display:flex;align-items:center;gap:10px;height:60px;flex-shrink:0;
    padding:0 16px;border-bottom:1px solid var(--line);
  }
  .sb-brand{font-size:16px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;}
  .sb-brand span{color:#38BDF8;}
  .sb-collapse{
    margin-left:auto;width:30px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:8px;background:transparent;
    color:var(--text-soft);cursor:pointer;
  }
  .sb-collapse:hover{color:#fff;border-color:var(--line-2);}
  .sb-collapse svg{width:16px;height:16px;transition:transform 0.18s ease;}

  .sb-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
  .sb-group{
    font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--text-dim);padding:14px 12px 6px;white-space:nowrap;overflow:hidden;
  }
  .sb-item{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:none;color:var(--text-soft);
    padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;
    font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;
    transition:background 0.14s ease, color 0.14s ease;
  }
  .sb-item svg{width:18px;height:18px;flex-shrink:0;}
  .sb-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .sb-item.active{background:var(--accent);color:#fff;}
  .sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
  .sb-badge{
    background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:1;
    padding:3px 6px;border-radius:999px;flex-shrink:0;
  }
  .sb-item.active .sb-badge{background:rgba(255,255,255,0.25);}

  .sb-foot{padding:12px 10px;border-top:1px solid var(--line);flex-shrink:0;}
  .sb-user{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;overflow:hidden;}
  .sb-avatar{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:var(--accent-soft);color:#9DC0FF;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  }
  .sb-user-meta{min-width:0;white-space:nowrap;overflow:hidden;}
  .sb-user-meta b{display:block;font-size:13px;font-weight:600;text-overflow:ellipsis;overflow:hidden;}
  .sb-user-meta small{color:var(--text-dim);font-size:11.5px;}
  .sb-logout{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:10px 12px;border:none;border-radius:9px;font-family:inherit;
    background:rgba(255,255,255,0.05);color:var(--text-soft);
    font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;
  }
  .sb-logout:hover{background:var(--bad-soft);color:#FCA5A5;}
  .sb-logout svg{width:17px;height:17px;flex-shrink:0;}

  /* Collapsed rail — icons only. */
  .admin-shell.collapsed .admin-sidebar{width:var(--sidebar-w-collapsed);}
  .admin-shell.collapsed .sb-label,
  .admin-shell.collapsed .sb-badge,
  .admin-shell.collapsed .sb-brand,
  .admin-shell.collapsed .sb-group,
  .admin-shell.collapsed .sb-user-meta,
  .admin-shell.collapsed .sb-logout span{display:none;}
  .admin-shell.collapsed .sb-item,
  .admin-shell.collapsed .sb-logout{justify-content:center;padding-left:0;padding-right:0;}
  .admin-shell.collapsed .sb-head{justify-content:center;padding:0 8px;}
  .admin-shell.collapsed .sb-collapse{margin-left:0;}
  .admin-shell.collapsed .sb-collapse svg{transform:rotate(180deg);}
  .admin-shell.collapsed .sb-user{justify-content:center;padding:6px 0 10px;}
  .admin-shell.collapsed .admin-body{margin-left:var(--sidebar-w-collapsed);}

  .sb-scrim{
    position:fixed;inset:0;z-index:35;background:rgba(3,7,18,0.6);
    opacity:0;pointer-events:none;transition:opacity 0.2s ease;
  }

  .admin-body{margin-left:var(--sidebar-w);min-width:0;transition:margin-left 0.18s ease;}

  /* ---------- Topbar ---------- */
  .admin-topbar{
    position:sticky;top:0;z-index:30;height:60px;
    display:flex;align-items:center;gap:12px;padding:0 20px;
    background:rgba(11,18,32,0.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .tb-burger{
    display:none;width:36px;height:36px;flex-shrink:0;
    align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:9px;background:var(--card2);
    color:var(--text);cursor:pointer;
  }
  .tb-burger svg{width:18px;height:18px;}
  .tb-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .tb-search{position:relative;margin-left:auto;width:min(340px,42vw);flex-shrink:1;}
  .tb-search > svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-dim);pointer-events:none;
  }
  .tb-search input{
    width:100%;padding:9px 12px 9px 36px;border-radius:9px;
    border:1px solid var(--line);background:var(--card2);color:var(--text);
    font-size:13.5px;font-family:inherit;
  }
  .tb-search input::placeholder{color:var(--text-dim);}
  .tb-search input:focus{outline:none;border-color:var(--accent);background:var(--card-hi);}
  .tb-results{
    position:absolute;top:calc(100% + 8px);right:0;width:min(420px,86vw);
    background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55);max-height:70vh;overflow-y:auto;
  }
  .tb-results[hidden]{display:none;}
  .tb-res-group{
    font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--text-dim);padding:10px 14px 5px;
  }
  .tb-res{
    display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;
    padding:9px 14px;color:var(--text);font-size:13.5px;cursor:pointer;
  }
  .tb-res:hover{background:var(--card-hi);}
  .tb-res small{display:block;color:var(--text-dim);font-size:11.5px;margin-top:1px;}
  .tb-empty{padding:16px 14px;color:var(--text-dim);font-size:13px;}

  .role-chip{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
    background:var(--accent-soft);color:#9DC0FF;white-space:nowrap;
  }

  /* ---------- Main ---------- */
  .admin-main{padding:24px 24px 56px;max-width:1600px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .page-head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.015em;}
  .page-head p{margin:4px 0 0;color:var(--text-soft);font-size:13.5px;}
  .page-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;
    color:var(--text-soft);font-family:inherit;font-size:13px;cursor:pointer;
    padding:0;margin-bottom:10px;
  }
  .back-link:hover{color:var(--accent);}
  .back-link svg{width:15px;height:15px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
    font-family:inherit;cursor:pointer;white-space:nowrap;
    border:1px solid var(--line);background:var(--card2);color:var(--text);
    transition:border-color 0.14s ease, background 0.14s ease;
  }
  .btn:hover{border-color:var(--line-2);background:var(--card-hi);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.ok{border-color:rgba(34,197,94,0.45);color:#86EFAC;background:var(--ok-soft);}
  .btn.ok:hover{background:rgba(34,197,94,0.24);}
  .btn.warn{border-color:rgba(245,158,11,0.45);color:#FCD34D;background:var(--warn-soft);}
  .btn.warn:hover{background:rgba(245,158,11,0.24);}
  .btn.bad{border-color:rgba(239,68,68,0.45);color:#FCA5A5;background:var(--bad-soft);}
  .btn.bad:hover{background:rgba(239,68,68,0.24);}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn.sm svg{width:13px;height:13px;}
  .btn.on{border-color:var(--accent);color:#fff;background:var(--accent-soft);}
  .btn.spinning svg{animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Cards & stats ---------- */
  .card{background:var(--card2);border:1px solid var(--line);border-radius:14px;}
  .card-pad{padding:18px 20px;}
  .card-title{
    display:flex;align-items:center;gap:8px;margin:0 0 14px;
    font-size:14px;font-weight:700;letter-spacing:-0.01em;
  }
  .card-title small{margin-left:auto;color:var(--text-dim);font-size:11.5px;font-weight:500;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px;}
  .stat{
    background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    display:flex;flex-direction:column;gap:6px;min-width:0;
  }
  .stat-top{display:flex;align-items:center;gap:9px;color:var(--text-soft);font-size:12.5px;font-weight:600;}
  .stat-ico{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:#9DC0FF;
  }
  .stat-ico svg{width:16px;height:16px;}
  .stat-ico.ok{background:var(--ok-soft);color:#86EFAC;}
  .stat-ico.warn{background:var(--warn-soft);color:#FCD34D;}
  .stat-ico.bad{background:var(--bad-soft);color:#FCA5A5;}
  .stat-val{font-size:25px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;}
  .stat-sub{font-size:12px;color:var(--text-dim);}

  .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:18px;align-items:start;}
  .grid-2-even{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;align-items:start;}

  /* ---------- Charts ---------- */
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-soft);}
  .chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px;}
  .chart-svg{width:100%;height:auto;display:block;}
  .hbars{display:flex;flex-direction:column;gap:11px;}
  .hbar-row{display:grid;grid-template-columns:minmax(72px,110px) 1fr 46px;gap:10px;align-items:center;font-size:12.5px;}
  .hbar-label{color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hbar-track{display:block;height:8px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;}
  /* Both are spans; without display:block the fill stays inline and its
     width/height are ignored, leaving only the empty track visible. */
  .hbar-fill{display:block;height:100%;border-radius:999px;background:var(--accent);}
  .hbar-val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}

  /* ---------- Tables ---------- */
  .table-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .table-search{position:relative;flex:1;min-width:180px;max-width:320px;}
  .table-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-dim);pointer-events:none;}
  .table-search input{
    width:100%;padding:9px 12px 9px 34px;border-radius:9px;
    border:1px solid var(--line);background:var(--card2);color:var(--text);
    font-size:13.5px;font-family:inherit;
  }
  .table-search input::placeholder{color:var(--text-dim);}
  .table-search input:focus{outline:none;border-color:var(--accent);}
  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;}
  .seg button{
    border:none;background:none;color:var(--text-soft);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;
  }
  .seg button:hover{color:#fff;}
  .seg button.on{background:var(--accent);color:#fff;}

  .table-wrap{border:1px solid var(--line);border-radius:14px;background:var(--card2);overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.1s ease;}
  tbody tr:hover{background:rgba(255,255,255,0.035);}
  tbody tr.clickable{cursor:pointer;}
  th{
    color:var(--text-soft);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--panel);user-select:none;
  }
  th.sortable{cursor:pointer;}
  th.sortable:hover{color:#fff;}
  th .sort-ar{display:inline-block;opacity:0.3;margin-left:4px;line-height:0;vertical-align:-1px;transition:transform 0.15s ease;}
  th .sort-ar svg{width:10px;height:10px;}
  th .sort-ar.up{transform:rotate(180deg);}
  th.sorted .sort-ar{opacity:1;color:var(--accent);}
  td.dim{color:var(--text-soft);}
  td.wrap{white-space:normal;min-width:220px;}
  td.num{font-variant-numeric:tabular-nums;}
  .cell-actions{display:flex;gap:6px;}

  .pager{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:11px 14px;border-top:1px solid var(--line);background:var(--panel);
    font-size:12.5px;color:var(--text-soft);
  }
  .pager .spacer{flex:1;}
  .pager button{
    min-width:32px;height:30px;padding:0 9px;border-radius:7px;
    border:1px solid var(--line);background:var(--card2);color:var(--text-soft);
    font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .pager button:hover:not(:disabled){color:#fff;border-color:var(--line-2);}
  .pager button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pager button:disabled{opacity:0.35;cursor:not-allowed;}

  /* ---------- Pills ---------- */
  .pill{
    display:inline-block;padding:4px 9px;border-radius:999px;
    font-size:11px;font-weight:700;white-space:nowrap;
  }
  .pill-blue{background:var(--accent-soft);color:#9DC0FF;}
  .pill-ok{background:var(--ok-soft);color:#86EFAC;}
  .pill-warn{background:var(--warn-soft);color:#FCD34D;}
  .pill-bad{background:var(--bad-soft);color:#FCA5A5;}
  .pill-dim{background:rgba(255,255,255,0.07);color:var(--text-soft);}
  .tag{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;
    border-radius:999px;margin-left:6px;vertical-align:1px;
  }
  .tag-bad{color:#FCA5A5;background:var(--bad-soft);}
  .tag-blue{color:#9DC0FF;background:var(--accent-soft);}

  select.inline{
    padding:6px 8px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:12.5px;font-family:inherit;
  }
  select.inline:focus{outline:none;border-color:var(--accent);}

  /* ---------- States ---------- */
  .state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:56px 24px;gap:10px;
  }
  .state svg{width:34px;height:34px;color:var(--text-dim);}
  .state h3{margin:0;font-size:15px;font-weight:600;}
  .state p{margin:0;color:var(--text-soft);font-size:13.5px;max-width:440px;}
  .skel{
    height:12px;border-radius:6px;
    background:linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.11) 37%, rgba(255,255,255,0.05) 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  .skel-card{height:96px;border-radius:14px;}

  /* ---------- Detail views ---------- */
  .detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:13.5px;margin:0;}
  .kv dt{color:var(--text-soft);}
  .kv dd{margin:0;word-break:break-word;}
  .photo-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .photo-strip img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--panel);}
  .avatar-lg{
    width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;
    background:var(--accent-soft);color:#9DC0FF;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;background:rgba(3,7,18,0.66);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal{
    width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;
    background:#0F1A2E;border:1px solid rgba(255,255,255,0.14);border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,0.6);color:#E7ECF7;
    font-family:-apple-system,'Inter',system-ui,sans-serif;
    --line:rgba(255,255,255,0.08); --card2:#131F3A; --text:#E7ECF7;
    --text-soft:#8B97B3; --text-dim:#5F6C8A; --accent:#4F8CFF; --accent-dark:#3D6FE0;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:17px 20px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .modal-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .modal-x{
    width:31px;height:31px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--text-soft);cursor:pointer;font-size:15px;
    line-height:1;flex-shrink:0;font-family:inherit;
  }
  .modal-x{display:flex;align-items:center;justify-content:center;}
  .modal-x svg{width:14px;height:14px;}
  .modal-x:hover{color:#fff;}
  .modal-body{padding:18px 20px;overflow-y:auto;}
  .modal-foot{display:flex;gap:10px;padding:15px 20px;border-top:1px solid var(--line);flex-shrink:0;}
  .modal-foot .btn{flex:1;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:13.5px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field input:disabled{opacity:0.6;}
  .field textarea{resize:vertical;min-height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer;margin-bottom:9px;}
  .check input{width:auto;margin:0;}
  .hint{font-size:11.5px;color:var(--text-dim);margin:-7px 0 13px;}
  .form-err{color:#FCA5A5;font-size:12.5px;min-height:17px;margin:2px 0 0;}

  /* ---------- Toasts ---------- */
  .toast-stack{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:flex-end;}
  .toast{
    display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:11px;
    background:#141F3B;border:1px solid rgba(255,255,255,0.14);color:#E7ECF7;
    font-size:13.5px;font-weight:500;max-width:min(400px,88vw);
    box-shadow:0 14px 40px rgba(0,0,0,0.5);
    font-family:-apple-system,'Inter',system-ui,sans-serif;
    animation:toastIn 0.2s ease;
  }
  .toast svg{width:16px;height:16px;flex-shrink:0;}
  .toast.ok{border-color:rgba(34,197,94,0.5);} .toast.ok svg{color:#86EFAC;}
  .toast.bad{border-color:rgba(239,68,68,0.5);} .toast.bad svg{color:#FCA5A5;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---------- Responsive ---------- */
  @media(max-width:1100px){
    .grid-2,.grid-2-even,.detail-grid{grid-template-columns:1fr;}
  }
  @media(max-width:980px){
    .admin-sidebar{transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,0.6);}
    .admin-shell.drawer .admin-sidebar{transform:none;}
    .admin-shell.drawer .sb-scrim{opacity:1;pointer-events:auto;}
    .admin-body,.admin-shell.collapsed .admin-body{margin-left:0;}
    /* The rail collapse is a desktop affordance; on mobile the drawer is
       always the full-width version, so undo the collapsed class here. */
    .admin-shell.collapsed .admin-sidebar{width:var(--sidebar-w);}
    .admin-shell.collapsed .sb-label,.admin-shell.collapsed .sb-badge,
    .admin-shell.collapsed .sb-user-meta,.admin-shell.collapsed .sb-logout span{display:block;}
    .admin-shell.collapsed .sb-brand{display:block;}
    .admin-shell.collapsed .sb-group{display:block;}
    .admin-shell.collapsed .sb-item,.admin-shell.collapsed .sb-logout{justify-content:flex-start;padding-left:12px;padding-right:12px;}
    .admin-shell.collapsed .sb-head{justify-content:flex-start;padding:0 16px;}
    .admin-shell.collapsed .sb-user{justify-content:flex-start;padding:6px 8px 10px;}
    .tb-burger{display:flex;}
    .sb-collapse{display:none;}
  }
  @media(max-width:720px){
    .admin-main{padding:18px 14px 48px;}
    .admin-topbar{padding:0 14px;gap:9px;}
    .tb-title{display:none;}
    .tb-search{width:100%;}
    .role-chip{display:none;}
    .stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
    .kv{grid-template-columns:1fr;gap:2px 0;}
    .kv dt{margin-top:9px;font-size:11.5px;}
    .table-search{max-width:none;}
  }
  @media(max-width:400px){
    .admin-main{padding:14px 10px 44px;}
    .stat-grid{grid-template-columns:1fr;}
    .stat-val{font-size:22px;}
    .page-head h1{font-size:18px;}
    .card-pad{padding:14px;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ==========================================================
     1. Utilities
     ========================================================== */
  function byId(id){ return document.getElementById(id); }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }
  function fmt(n){
    var v = Number(n);
    if(!isFinite(v)) return "0";
    return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  function money(n){ return fmt(n) + " so'm"; }
  function dt(ms){
    if(!ms) return "";
    var d = new Date(ms);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleString("uz-UZ", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  }
  function dateOnly(ms){
    if(!ms) return "";
    var d = new Date(ms);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleDateString("uz-UZ", {year:"numeric",month:"2-digit",day:"2-digit"});
  }
  function relTime(ms){
    if(!ms) return "";
    var diff = Date.now() - ms;
    if(diff < 0) return dt(ms);
    var mins = Math.floor(diff/60000);
    if(mins < 1) return "hozirgina";
    if(mins < 60) return mins + " daqiqa oldin";
    var hours = Math.floor(mins/60);
    if(hours < 24) return hours + " soat oldin";
    var days = Math.floor(hours/24);
    if(days < 30) return days + " kun oldin";
    return dateOnly(ms);
  }
  function debounce(fn, ms){
    var t = null;
    return function(){
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(self, args); }, ms);
    };
  }
  /** Case-insensitive "does any of these fields contain q". */
  function matches(fields, q){
    for(var i = 0; i < fields.length; i++){
      if(String(fields[i] == null ? "" : fields[i]).toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
  }
  function initials(s){ return (String(s || "?").trim().charAt(0) || "?").toUpperCase(); }
  function pct(part, total){ return total > 0 ? Math.round((part / total) * 100) : 0; }

  /* ==========================================================
     2. Icons
     ========================================================== */
  var I = {
    dashboard: '<path d="M3 13h8V3H3v10Zm10 8h8V11h-8v10ZM3 21h8v-6H3v6ZM13 9h8V3h-8v6Z"/>',
    box: '<path d="M21 8v8a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
    route: '<circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h5a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h5"/>',

    check: '<path d="M20 6 9 17l-5-5"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',

    flag: '<path d="M4 22V4M4 4h12l-2 4 2 4H4"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    chart: '<path d="M3 3v18h18"/><path d="m7 15 3-4 3 3 5-7"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.2V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.2-2.7H1.6a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.3 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.2V1.6a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.2 2.7h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.2 1.2Z" transform="translate(1.6 1.6) scale(0.87)"/>',
    refresh: '<path d="M4 12A8 8 0 0 1 18 6.3"/><path d="M20 12A8 8 0 0 1 6 17.7"/><path d="M18 3.5V7H14.5M6 20.5V17H9.5"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    back: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>',
    empty: '<circle cx="12" cy="12" r="9"/><path d="M9 15h6M9.5 9.5h.01M14.5 9.5h.01"/>',
    warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
    lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.2-5.4-2.9-5.4 2.9 1-6.2L3.2 9.5l6.1-.9Z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    trash: '<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    pin: '<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>'
  };
  function ico(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (I[name] || "") + '</svg>';
  }

  /* ==========================================================
     3. Labels — the enum vocabularies the API speaks
     ========================================================== */
  var ROLE_LABELS = { DRIVER:"Haydovchi", OWNER:"Yuk beruvchi", BOTH:"Ikkalasi ham" };
  var CITIES = ["Toshkent","Samarqand","Buxoro","Andijon","Namangan","Nukus","Qarshi","Urganch","Farg'ona","Jizzax","Navoiy","Guliston","Termiz"];
  var VEHICLE_LABELS = {
    ISUZU:"Isuzu", GAZEL:"Gazel", FURGON:"Furgon", YARIM_TREYLER:"Yarim treyler",
    SAMOSVAL:"Samosval", BOSHQA:"Boshqa"
  };
  var REASON_LABELS = {
    SCAM:"Firibgarlik", FAKE_LOAD:"Soxta yuk e'loni", FAKE_DRIVER:"Soxta haydovchi",
    PAYMENT:"To'lov muammosi", BEHAVIOR:"Yomon muomala", DELIVERY:"Yetkazib berish muammosi",
    OTHER:"Boshqa"
  };
  var REPORT_STATUSES = ["NEW","INVESTIGATING","CONTACTED","RESOLVED","BANNED"];
  var REPORT_LABELS = {
    NEW:"Yangi", INVESTIGATING:"Tekshirilmoqda", CONTACTED:"Bog'lanildi",
    RESOLVED:"Hal qilindi", BANNED:"Bloklandi"
  };
  var REPORT_PILL = {
    NEW:"pill-bad", INVESTIGATING:"pill-warn", CONTACTED:"pill-blue",
    RESOLVED:"pill-ok", BANNED:"pill-dim"
  };
  var ORDER_LABELS = {
    NEW:"Yangi", DRIVER_FOUND:"Haydovchi topildi", PICKING_UP:"Yuklashga ketdi",
    LOADED:"Yuklandi", ON_THE_WAY:"Yo'lda",
    DELIVERED:"Yetkazildi", CANCELLED:"Bekor qilindi"
  };
  var ORDER_PILL = {
    NEW:"pill-dim", DRIVER_FOUND:"pill-warn", PICKING_UP:"pill-warn",
    LOADED:"pill-blue", ON_THE_WAY:"pill-blue",
    DELIVERED:"pill-ok", CANCELLED:"pill-bad"
  };
  var TRUCK_STATUSES = ["PENDING","ACTIVE","PAUSED","SOLD","REJECTED"];
  var TRUCK_LABELS = {
    PENDING:"Tekshiruvda", ACTIVE:"Faol", PAUSED:"To'xtatilgan", SOLD:"Sotilgan", REJECTED:"Rad etilgan"
  };
  var TRUCK_PILL = {
    PENDING:"pill-warn", ACTIVE:"pill-ok", PAUSED:"pill-dim", SOLD:"pill-blue", REJECTED:"pill-bad"
  };
  /* Yuk transporti turkumlari. Oxirgi to'rttasi — bozor yuk texnikasiga
     qisqartirilgunga qadar joylangan eski e'lonlar uchun; yangi e'lon
     ularda ochilmaydi, lekin admin ularni ko'ra olishi kerak. */
  var TRUCK_CAT_LABELS = {
    YUK:"Yuk mashinasi", FURGON:"Furgon", TIRKAMA:"Tirkama", SAMOSVAL:"Samosval",
    REFRIJERATOR:"Refrijerator", EVAKUATOR:"Evakuator", MAXSUS:"Maxsus texnika",
    BOSHQA:"Boshqa yuk texnikasi",
    YENGIL:"Yengil avtomobil (eski)", MIKROAVTOBUS:"Mikroavtobus (eski)",
    AVTOBUS:"Avtobus (eski)", MOTOSIKL:"Motosikl (eski)"
  };
  var ROLE_NAMES = { SUPER_ADMIN:"Super admin", ADMIN:"Admin", MODERATOR:"Moderator" };

  /* Emoji o'rniga ishlatiladigan kichik belgilar — jadval kataklarida
     matn bilan bir qatorda turadi, shuning uchun o'lchami inline berilgan. */
  var CHECK_MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" '
    + 'stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;vertical-align:-1px;">'
    + '<path d="m5 12.5 5 5 9-10"/></svg>';
  var STAR_MARK = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" '
    + 'style="width:12px;height:12px;vertical-align:-1.5px;">'
    + '<path d="m12 3.2 2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 18.17l-5.88 3.14 1.12-6.55L2.48 10.1l6.58-.96L12 3.2Z"/></svg>';

  function pill(text, cls){ return '<span class="pill ' + cls + '">' + esc(text) + '</span>'; }
  function orderPill(s){ var k = s || "NEW"; return pill(ORDER_LABELS[k] || k, ORDER_PILL[k] || "pill-dim"); }
  function truckPill(s){ var k = s || "ACTIVE"; return pill(TRUCK_LABELS[k] || k, TRUCK_PILL[k] || "pill-dim"); }
  function reportPill(s){ var k = s || "NEW"; return pill(REPORT_LABELS[k] || k, REPORT_PILL[k] || "pill-dim"); }
  function truckStatus(t){ return t.status || "ACTIVE"; }

  /* Moderatsiya ishga tushgan payt (api/admin-data.js dagi
     MODERATION_LAUNCHED_AT bilan bir xil). Bundan oldin joylangan va
     hech kim ko'rib chiqmagan e'lonlar avtomatik ravishda saytga
     chiqib ketgan edi. Bu yerdagi hisob faqat tugmani ko'rsatish
     uchun — kimni qaytarishni server o'zi qaytadan aniqlaydi. */
  var MODERATION_LAUNCHED_AT = Date.parse("2026-09-01T06:18:58Z");
  function isUnreviewedLegacy(t){
    return truckStatus(t) === "ACTIVE"
      && !t.moderatedAt
      && Number(t.createdAt || 0) < MODERATION_LAUNCHED_AT;
  }

  /* ==========================================================
     4. Toasts
     ========================================================== */
  function toast(msg, kind){
    var stack = byId("toastStack");
    var el = document.createElement("div");
    el.className = "toast " + (kind || "");
    el.innerHTML = ico(kind === "bad" ? "warn" : "check") + "<span>" + esc(msg) + "</span>";
    stack.appendChild(el);
    setTimeout(function(){
      el.style.transition = "opacity 0.25s ease, transform 0.25s ease";
      el.style.opacity = "0";
      el.style.transform = "translateY(8px)";
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, kind === "bad" ? 5200 : 3200);
  }

  /* ==========================================================
     5. API service layer
     Every network call goes through here, so error handling,
     the 401 → "your session ended" path and the 403 → "your role
     can't do that" path exist in exactly one place.
     ========================================================== */
  var Api = {
    request: function(url, options){
      return fetch(url, options).then(function(r){
        return r.text().then(function(text){
          var body = {};
          try { body = text ? JSON.parse(text) : {}; } catch(e){ body = {}; }
          if(r.status === 401){
            var err401 = new Error("Sessiya tugadi. Qaytadan kiring.");
            err401.unauth = true;
            throw err401;
          }
          if(r.status === 403){
            var err403 = new Error(body.error || "Bu amal uchun ruxsatingiz yo'q");
            err403.forbidden = true;
            throw err403;
          }
          if(!r.ok) throw new Error(body.error || "Server xatosi (" + r.status + ")");
          return body;
        });
      }, function(){
        throw new Error("Internetga ulanib bo'lmadi");
      });
    },
    get: function(query){
      return Api.request("/api/admin-data?" + query);
    },
    post: function(action, body){
      return Api.request("/api/admin-data?action=" + encodeURIComponent(action), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
    },
    session: function(){ return Api.request("/api/admin-login"); },
    login: function(password){
      return Api.request("/api/admin-login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: password})
      });
    },
    logout: function(){
      return Api.request("/api/admin-login?action=logout", {method: "POST"});
    }
  };

  /**
   * Any 401 anywhere means the cookie is gone or expired: drop every
   * cached row and go back to the login screen. Nothing stays on screen
   * for a session that no longer exists.
   */
  function handleApiError(err){
    if(err && err.unauth){ endSession(true); return true; }
    return false;
  }

  /* ==========================================================
     6. Session + roles
     This mirrors the table in lib/adminAuth.js. It decides what to
     SHOW; the server decides what is allowed. A moderator who edits
     this file still gets a 403 from the API.
     ========================================================== */
  var PERMISSIONS = {
    SUPER_ADMIN: ["*"],
    ADMIN: [
      "orders:read","users:read","users:write","reports:read","reports:write",
      "trucks:read","trucks:write","messages:read","analytics:read",
      "settings:read","settings:write"
    ],
    MODERATOR: [
      "orders:read","users:read","reports:read","reports:write",
      "trucks:read","trucks:write","messages:read"
    ]
  };
  var session = { role: null };
  function can(permission){
    if(!permission) return Boolean(session.role);
    var granted = PERMISSIONS[session.role] || [];
    return granted.indexOf("*") !== -1 || granted.indexOf(permission) !== -1;
  }

  /* ==========================================================
     7. Store — one cache per resource, with an explicit state so
     every screen can render loading / error / empty honestly
     instead of showing a blank table.
     ========================================================== */
  var RESOURCES = {
    orders:   { query:"resource=orders",   perm:"orders:read",   key:"orders" },
    users:    { query:"resource=users",    perm:"users:read",    key:"users" },
    trucks:   { query:"resource=trucks",   perm:"trucks:read",   key:"trucks" },
    reports:  { query:"resource=reports",  perm:"reports:read",  key:"reports" },
    messages: { query:"resource=messages", perm:"messages:read", key:"messages" },
    settings: { query:"resource=settings", perm:"settings:read", key:"settings" }
  };
  var Store = {
    data: {},
    state: {},   // idle | loading | ready | error | denied
    error: {},
    loadedAt: {},

    reset: function(){
      Store.data = {}; Store.state = {}; Store.error = {}; Store.loadedAt = {};
      Object.keys(RESOURCES).forEach(function(n){ Store.state[n] = "idle"; });
      oneOff = {};
    },

    load: function(name, force){
      var def = RESOURCES[name];
      if(!def) return Promise.resolve(null);
      if(!can(def.perm)){ Store.state[name] = "denied"; return Promise.resolve(null); }
      if(Store.state[name] === "loading") return Promise.resolve(null);
      if(Store.state[name] === "ready" && !force) return Promise.resolve(Store.data[name]);

      Store.state[name] = "loading";
      return Api.get(def.query).then(function(body){
        var value = body[def.key];
        Store.data[name] = value === undefined ? null : value;
        Store.state[name] = "ready";
        Store.loadedAt[name] = Date.now();
        Store.error[name] = null;
        render();
        return Store.data[name];
      }).catch(function(err){
        if(handleApiError(err)) return null;
        Store.state[name] = "error";
        Store.error[name] = err.message;
        render();
        return null;
      });
    },

    /** Refresh everything the current role may read. */
    reloadAll: function(){
      return Promise.all(Object.keys(RESOURCES).filter(function(n){
        return can(RESOURCES[n].perm);
      }).map(function(n){ return Store.load(n, true); }));
    },

    list: function(name){ return Store.data[name] || []; }
  };
  Store.reset();

  /* One-off records fetched by id (a single listing with its photos). */
  var oneOff = {};
  function loadOne(key, query, pick){
    if(oneOff[key] && (oneOff[key].state === "loading" || oneOff[key].state === "ready")) return;
    oneOff[key] = { state:"loading", data:null, error:null };
    Api.get(query).then(function(body){
      oneOff[key] = { state:"ready", data: pick(body), error:null };
      render();
    }).catch(function(err){
      if(handleApiError(err)) return;
      oneOff[key] = { state:"error", data:null, error: err.message };
      render();
    });
  }

  /* ==========================================================
     8. Shared render states
     ========================================================== */
  function stateBox(icon, title, text, retryView){
    return '<div class="card"><div class="state">' + ico(icon)
      + '<h3>' + esc(title) + '</h3>'
      + (text ? '<p>' + esc(text) + '</p>' : "")
      + (retryView ? '<button type="button" class="btn" data-act="reload" data-name="' + esc(retryView) + '">'
          + ico("refresh") + 'Qayta urinish</button>' : "")
      + '</div></div>';
  }
  function skeletonBlock(){
    var cards = "";
    for(var i = 0; i < 4; i++) cards += '<div class="skel skel-card"></div>';
    var lines = "";
    for(var j = 0; j < 7; j++){
      lines += '<div class="skel" style="margin:14px;width:' + (45 + (j % 4) * 13) + '%;"></div>';
    }
    return '<div class="stat-grid">' + cards + '</div>'
      + '<div class="card" style="overflow:hidden;">' + lines + '</div>';
  }

  /**
   * Wraps a view body in the right state. Kicks off any resource it
   * needs that hasn't loaded yet — Store.load re-renders when it lands,
   * so a view never has to know about loading order.
   */
  function withData(names, build){
    var pending = false, failed = null, denied = null;
    names.forEach(function(n){
      var def = RESOURCES[n];
      if(def && !can(def.perm)){ denied = denied || n; return; }
      var st = Store.state[n];
      if(st === "idle"){ Store.load(n); pending = true; }
      else if(st === "loading"){ pending = true; }
      else if(st === "error"){ failed = failed || n; }
      else if(st === "denied"){ denied = denied || n; }
    });
    if(denied){
      return stateBox("lock", "Ruxsat yo'q",
        "Sizning rolingiz (" + (ROLE_NAMES[session.role] || session.role) + ") bu bo'limni ko'ra olmaydi.");
    }
    if(failed) return stateBox("warn", "Yuklab bo'lmadi", Store.error[failed] || "", failed);
    if(pending) return skeletonBlock();
    return build();
  }

  /* ==========================================================
     9. DataTable — one component behind every list screen.
     Search, sort and pagination all operate on the real rows; the
     view state lives per-table so switching screens and coming back
     keeps your place.
     ========================================================== */
  var tableState = {};   // id -> {q, sortKey, sortDir, page, filter}
  function tState(id, defaults){
    if(!tableState[id]){
      tableState[id] = {
        q: "", sortKey: (defaults && defaults.sortKey) || null,
        sortDir: (defaults && defaults.sortDir) || "desc",
        page: 1, filter: (defaults && defaults.filter) || "ALL"
      };
    }
    return tableState[id];
  }
  var PAGE_SIZE = 20;

  /**
   * cfg: {
   *   id, columns:[{key,label,sortable,cls,render(row),value(row)}],
   *   rows, search(row,q), rowAttrs(row), filters:[{key,label,count}],
   *   emptyTitle, emptyText, toolbarExtra
   * }
   */
  function dataTable(cfg){
    var st = tState(cfg.id, cfg.defaults);
    var rows = cfg.rows.slice();

    if(cfg.filters && st.filter !== "ALL" && cfg.filterFn){
      rows = rows.filter(function(r){ return cfg.filterFn(r, st.filter); });
    }
    var q = st.q.trim().toLowerCase();
    if(q && cfg.search) rows = rows.filter(function(r){ return cfg.search(r, q); });

    var total = rows.length;
    if(st.sortKey){
      var col = null;
      cfg.columns.forEach(function(c){ if(c.key === st.sortKey) col = c; });
      if(col){
        var dir = st.sortDir === "asc" ? 1 : -1;
        rows.sort(function(a, b){
          var va = col.value ? col.value(a) : "";
          var vb = col.value ? col.value(b) : "";
          if(typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
          return String(va).localeCompare(String(vb), "uz") * dir;
        });
      }
    }

    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if(st.page > pages) st.page = pages;
    var start = (st.page - 1) * PAGE_SIZE;
    var pageRows = rows.slice(start, start + PAGE_SIZE);

    /* --- toolbar --- */
    var html = '<div class="table-tools">';
    if(cfg.search !== false){
      html += '<div class="table-search">' + ico("search")
        + '<input type="search" data-act="table-search" data-id="' + esc(cfg.id) + '" '
        + 'value="' + esc(st.q) + '" placeholder="' + esc(cfg.searchPlaceholder || "Qidirish…") + '">'
        + '</div>';
    }
    if(cfg.filters && cfg.filters.length){
      html += '<div class="seg">' + cfg.filters.map(function(f){
        return '<button type="button" data-act="table-filter" data-id="' + esc(cfg.id) + '" '
          + 'data-filter="' + esc(f.key) + '" class="' + (st.filter === f.key ? "on" : "") + '">'
          + esc(f.label) + (f.count === undefined ? "" : " " + f.count) + '</button>';
      }).join("") + '</div>';
    }
    if(cfg.toolbarExtra) html += cfg.toolbarExtra;
    html += '</div>';

    /* --- table --- */
    html += '<div class="table-wrap"><div class="table-scroll"><table><thead><tr>';
    cfg.columns.forEach(function(c){
      var sorted = st.sortKey === c.key;
      html += '<th' + (c.sortable ? ' class="sortable' + (sorted ? " sorted" : "") + '"'
              + ' data-act="table-sort" data-id="' + esc(cfg.id) + '" data-key="' + esc(c.key) + '"' : "")
        + '>' + esc(c.label)
        + (c.sortable
            ? '<span class="sort-ar' + (sorted && st.sortDir === "asc" ? " up" : "") + '">'
              + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
              + 'stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg></span>'
            : "")
        + '</th>';
    });
    html += '</tr></thead><tbody>';

    if(!pageRows.length){
      html += '<tr><td colspan="' + cfg.columns.length + '" style="padding:0;">'
        + '<div class="state">' + ico("empty")
        + '<h3>' + esc(q || st.filter !== "ALL" ? "Hech narsa topilmadi" : (cfg.emptyTitle || "Bo'sh")) + '</h3>'
        + '<p>' + esc(q || st.filter !== "ALL"
            ? "Qidiruv yoki filtrni o'zgartirib ko'ring."
            : (cfg.emptyText || "Bu yerda hozircha yozuv yo'q.")) + '</p>'
        + '</div></td></tr>';
    } else {
      pageRows.forEach(function(r){
        html += '<tr' + (cfg.rowAttrs ? " " + cfg.rowAttrs(r) : "") + '>';
        cfg.columns.forEach(function(c){
          html += '<td' + (c.cls ? ' class="' + c.cls + '"' : "") + '>' + c.render(r) + '</td>';
        });
        html += '</tr>';
      });
    }
    html += '</tbody></table></div>';

    /* --- pager --- */
    var from = total ? start + 1 : 0;
    var to = Math.min(start + PAGE_SIZE, total);
    html += '<div class="pager"><span>' + from + '–' + to + ' / ' + total
      + (cfg.unit ? " " + esc(cfg.unit) : "") + '</span><span class="spacer"></span>';
    if(pages > 1){
      html += '<button type="button" data-act="table-page" data-id="' + esc(cfg.id) + '" data-page="'
        + (st.page - 1) + '"' + (st.page === 1 ? " disabled" : "") + '>‹</button>';
      pageNumbers(st.page, pages).forEach(function(p){
        if(p === "…"){ html += '<span>…</span>'; return; }
        html += '<button type="button" data-act="table-page" data-id="' + esc(cfg.id) + '" data-page="' + p + '"'
          + (p === st.page ? ' class="on"' : "") + '>' + p + '</button>';
      });
      html += '<button type="button" data-act="table-page" data-id="' + esc(cfg.id) + '" data-page="'
        + (st.page + 1) + '"' + (st.page === pages ? " disabled" : "") + '>›</button>';
    }
    html += '</div></div>';
    return html;
  }

  /** 1 … 4 [5] 6 … 12 — never more than ~7 buttons however many pages. */
  function pageNumbers(current, pages){
    var out = [], i;
    if(pages <= 7){
      for(i = 1; i <= pages; i++) out.push(i);
      return out;
    }
    out.push(1);
    var lo = Math.max(2, current - 1), hi = Math.min(pages - 1, current + 1);
    if(lo > 2) out.push("…");
    for(i = lo; i <= hi; i++) out.push(i);
    if(hi < pages - 1) out.push("…");
    out.push(pages);
    return out;
  }

  /* ==========================================================
     10. Charts — plain SVG built from the real rows. No library,
     no placeholder series: an empty dataset renders an empty state.
     ========================================================== */
  /** Grouped vertical bars over N days. series: [{label,color,values:[]}] */
  function barChart(labels, series){
    var W = 760, H = 210, padL = 34, padR = 8, padT = 12, padB = 26;
    var max = 0;
    series.forEach(function(s){ s.values.forEach(function(v){ if(v > max) max = v; }); });
    if(max === 0) max = 1;
    var niceMax = Math.ceil(max / 4) * 4 || 4;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var slot = plotW / labels.length;
    var barW = Math.max(3, Math.min(14, (slot - 6) / series.length));

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">';
    for(var g = 0; g <= 4; g++){
      var y = padT + plotH - (plotH * g / 4);
      svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1)
        + '" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>'
        + '<text x="' + (padL - 7) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" '
        + 'font-size="9.5" fill="#5F6C8A">' + Math.round(niceMax * g / 4) + '</text>';
    }
    labels.forEach(function(lab, i){
      var groupX = padL + slot * i + (slot - barW * series.length) / 2;
      series.forEach(function(s, si){
        var v = s.values[i] || 0;
        var h = (v / niceMax) * plotH;
        var x = groupX + si * barW;
        var y = padT + plotH - h;
        svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (barW - 1.5).toFixed(1)
          + '" height="' + Math.max(v > 0 ? 2 : 0, h).toFixed(1) + '" rx="2" fill="' + s.color + '">'
          + '<title>' + esc(lab + " — " + s.label + ": " + v) + '</title></rect>';
      });
      // Every other label on a 14-day axis, so they never collide.
      if(labels.length <= 8 || i % 2 === 1){
        svg += '<text x="' + (padL + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 8)
          + '" text-anchor="middle" font-size="9.5" fill="#5F6C8A">' + esc(lab) + '</text>';
      }
    });
    svg += '</svg>';
    svg += '<div class="chart-legend">' + series.map(function(s){
      return '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + '</span>';
    }).join("") + '</div>';
    return svg;
  }

  /** Horizontal ranked bars — cities, categories, cargo types. */
  function hbars(items, color){
    if(!items.length){
      return '<p style="color:var(--text-dim);font-size:13px;margin:6px 0 0;">Ma\'lumot yo\'q.</p>';
    }
    var max = items[0].value || 1;
    return '<div class="hbars">' + items.map(function(it){
      return '<div class="hbar-row">'
        + '<span class="hbar-label" title="' + esc(it.label) + '">' + esc(it.label) + '</span>'
        + '<span class="hbar-track"><span class="hbar-fill" style="width:'
        + Math.max(2, Math.round((it.value / max) * 100)) + '%;'
        + (color ? "background:" + color + ";" : "") + '"></span></span>'
        + '<span class="hbar-val">' + fmt(it.value) + '</span>'
        + '</div>';
    }).join("") + '</div>';
  }

  /** Counts an array into a ranked [{label,value}] list. */
  function rank(arr, keyFn, labelFn, limit){
    var counts = {};
    arr.forEach(function(x){
      var k = keyFn(x);
      if(k === undefined || k === null || k === "") return;
      counts[k] = (counts[k] || 0) + 1;
    });
    var out = Object.keys(counts).map(function(k){
      return { label: labelFn ? labelFn(k) : k, value: counts[k] };
    });
    out.sort(function(a, b){ return b.value - a.value; });
    return limit ? out.slice(0, limit) : out;
  }

  /** Day buckets for the last n days: [{key,label,start,end}] */
  function lastDays(n){
    var out = [];
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    for(var i = n - 1; i >= 0; i--){
      var start = new Date(d.getTime() - i * 86400000);
      out.push({
        start: start.getTime(),
        end: start.getTime() + 86400000,
        label: String(start.getDate()).padStart(2, "0") + "." + String(start.getMonth() + 1).padStart(2, "0")
      });
    }
    return out;
  }
  function countInDays(items, days, tsFn){
    return days.map(function(d){
      var c = 0;
      items.forEach(function(x){
        var ts = tsFn(x);
        if(ts >= d.start && ts < d.end) c++;
      });
      return c;
    });
  }

  /* ==========================================================
     11. Modal
     ========================================================== */
  var modalOnSave = null;
  function openModal(opts){
    byId("modalTitle").textContent = opts.title || "";
    byId("modalBody").innerHTML = opts.body || "";
    byId("modalFoot").innerHTML = opts.foot
      || '<button type="button" class="btn" data-act="modal-close">Bekor qilish</button>'
         + '<button type="button" class="btn primary" data-act="modal-save">Saqlash</button>';
    modalOnSave = opts.onSave || null;
    byId("modalBackdrop").hidden = false;
    var first = byId("modalBody").querySelector("input,select,textarea");
    if(first) first.focus();
  }
  function closeModal(){
    byId("modalBackdrop").hidden = true;
    modalOnSave = null;
  }

  /* ==========================================================
     12. Routes
     Function declarations hoist, so the view functions further down
     are already defined by the time this array is evaluated.
     ========================================================== */
  var ROUTES = [
    { name:"dashboard",     label:"Boshqaruv paneli", icon:"dashboard", group:"Umumiy",     perm:null,             view:viewDashboard },
    { name:"loads",         label:"Yuk buyurtmalari", icon:"box",       group:"Operatsiya", perm:"orders:read",    view:viewLoads,    detail:viewLoadDetail },
    { name:"trips",         label:"Safarlar",         icon:"route",     group:"Operatsiya", perm:"orders:read",    view:viewTrips },
    { name:"trucks",        label:"Mashina e'lonlari",icon:"car",       group:"Operatsiya", perm:"trucks:read",    view:viewTrucks,   detail:viewTruckDetail, badge:pendingTrucksCount },
    { name:"verifications", label:"Tasdiqlashlar",    icon:"shield",    group:"Moderatsiya",perm:"users:write",    view:viewVerifications, badge:pendingVerificationsCount },
    { name:"reports",       label:"Shikoyatlar",      icon:"flag",      group:"Moderatsiya",perm:"reports:read",   view:viewReports,  badge:newReportsCount },
    { name:"users",         label:"Foydalanuvchilar", icon:"users",     group:"Moderatsiya",perm:"users:read",     view:viewUsers,    detail:viewUserDetail },
    { name:"messages",      label:"Murojaatlar",      icon:"mail",      group:"Moderatsiya",perm:"messages:read",  view:viewMessages },
    { name:"analytics",     label:"Tahlil",           icon:"chart",     group:"Tizim",      perm:"analytics:read", view:viewAnalytics },
    { name:"settings",      label:"Sozlamalar",       icon:"gear",      group:"Tizim",      perm:"settings:read",  view:viewSettings }
  ];
  function routeByName(name){
    for(var i = 0; i < ROUTES.length; i++) if(ROUTES[i].name === name) return ROUTES[i];
    return null;
  }
  function firstAllowedRoute(){
    for(var i = 0; i < ROUTES.length; i++) if(can(ROUTES[i].perm)) return ROUTES[i].name;
    return null;
  }

  /* Badge counts — computed from loaded data, blank until it arrives. */
  function pendingTrucksCount(){
    if(Store.state.trucks !== "ready") return 0;
    return Store.list("trucks").filter(function(t){ return truckStatus(t) === "PENDING"; }).length;
  }
  function newReportsCount(){
    if(Store.state.reports !== "ready") return 0;
    return Store.list("reports").filter(function(r){ return (r.status || "NEW") === "NEW"; }).length;
  }
  /* Nishondagi raqam — kutilayotgan so'rovlar, tur bo'yicha. Bitta
     odamda ikkita kutilayotgan so'rov bo'lishi mumkin va ikkalasini
     ham ko'rib chiqish kerak. */
  function pendingVerificationsCount(){
    if(Store.state.users !== "ready") return 0;
    var n = 0;
    Store.list("users").forEach(function(u){
      VERIFY_REVIEWED_KINDS.forEach(function(kind){
        if(verifyStateOf(u, kind).status === "PENDING") n++;
      });
    });
    return n;
  }

  /* ==========================================================
     13. Router — hash based, so the browser back button works and
     every screen is linkable.
     ========================================================== */
  var current = { name:null, param:null };

  function parseHash(){
    var h = String(location.hash || "").replace(/^#\/?/, "");
    if(!h) return { name:null, param:null };
    var parts = h.split("/");
    return { name: parts[0], param: parts[1] ? decodeURIComponent(parts[1]) : null };
  }
  function go(hash){
    if(location.hash === hash) render();
    else location.hash = hash;
  }
  function onHashChange(){
    var parsed = parseHash();
    var route = routeByName(parsed.name);
    if(!route || !can(route.perm)){
      var fallback = firstAllowedRoute();
      if(!fallback){ render(); return; }
      if(parsed.name && route && !can(route.perm)) toast("Bu bo'limga ruxsatingiz yo'q", "bad");
      current = { name: fallback, param: null };
      location.replace("#/" + fallback);
      // replace() fires hashchange itself only when the hash actually
      // differs — render here so a same-hash replace still paints.
      render();
      return;
    }
    current = parsed;
    window.scrollTo(0, 0);
    closeDrawer();
    render();
  }
  window.addEventListener("hashchange", onHashChange);

  /* ==========================================================
     14. Shell rendering — sidebar, topbar, main
     ========================================================== */
  function renderSidebar(){
    var groups = [];
    ROUTES.forEach(function(r){
      if(!can(r.perm)) return;
      var g = null;
      groups.forEach(function(x){ if(x.name === r.group) g = x; });
      if(!g){ g = { name:r.group, items:[] }; groups.push(g); }
      g.items.push(r);
    });

    byId("sbNav").innerHTML = groups.map(function(g){
      return '<div class="sb-group">' + esc(g.name) + '</div>' + g.items.map(function(r){
        var count = r.badge ? r.badge() : 0;
        return '<button type="button" class="sb-item' + (current.name === r.name ? " active" : "") + '" '
          + 'data-act="nav" data-name="' + esc(r.name) + '" title="' + esc(r.label) + '">'
          + ico(r.icon)
          + '<span class="sb-label">' + esc(r.label) + '</span>'
          + (count > 0 ? '<span class="sb-badge">' + count + '</span>' : "")
          + '</button>';
      }).join("");
    }).join("");

    var roleName = ROLE_NAMES[session.role] || session.role || "";

  /* ==========================================================
     15. Global search — one debounced pass over everything the
     role can already read, grouped by type.
     ========================================================== */
  function runGlobalSearch(raw){
    var box = byId("globalResults");
    var q = raw.trim().toLowerCase();
    if(q.length < 2){ box.hidden = true; box.innerHTML = ""; return; }

    // Pull in anything not cached yet so the first search isn't empty.
    ["users","orders","trucks","reports"].forEach(function(n){
      if(Store.state[n] === "idle") Store.load(n);
    });

    var groups = [];
    if(can("users:read")){
      var users = Store.list("users").filter(function(u){
        return matches([u.username, u.email, u.displayName, u.phone, u.city], q);
      }).slice(0, 5);
      if(users.length) groups.push({ label:"Foydalanuvchilar", items: users.map(function(u){
        return { hash:"#/users/" + encodeURIComponent(u.email),
                 title:(u.username ? "@" + u.username : u.email),
                 sub:[u.displayName, u.city, u.phone].filter(Boolean).join(" · ") || u.email };
      })});
    }
    if(can("orders:read")){
      var orders = Store.list("orders").filter(function(o){
        return matches([o.code, o.name, o.phone, o.fromCity, o.toCity, o.googleEmail], q);
      }).slice(0, 5);
      if(orders.length) groups.push({ label:"Buyurtmalar", items: orders.map(function(o){
        return { hash:"#/loads/" + encodeURIComponent(o.code),
                 title: o.code + " — " + (o.fromCity || "?") + " → " + (o.toCity || "?"),
                 sub:[o.name, o.phone].filter(Boolean).join(" · ") };
      })});
    }
    if(can("trucks:read")){
      var trucks = Store.list("trucks").filter(function(t){
        return matches([t.brand, t.city, t.sellerName, t.sellerUsername, t.id], q);
      }).slice(0, 5);
      if(trucks.length) groups.push({ label:"Mashina e'lonlari", items: trucks.map(function(t){
        return { hash:"#/trucks/" + encodeURIComponent(t.id),
                 title:(t.brand || "E'lon") + " · " + (t.year || ""),
                 sub:[TRUCK_LABELS[truckStatus(t)], t.city, t.sellerName].filter(Boolean).join(" · ") };
      })});
    }
    if(can("reports:read")){
      var reports = Store.list("reports").filter(function(r){
        return matches([r.targetContact, r.description, r.reporterEmail, REASON_LABELS[r.reason]], q);
      }).slice(0, 4);
      if(reports.length) groups.push({ label:"Shikoyatlar", items: reports.map(function(r){
        return { hash:"#/reports",
                 title:(REASON_LABELS[r.reason] || r.reason) + " — " + (r.targetContact || ""),
                 sub: REPORT_LABELS[r.status || "NEW"] + " · " + dateOnly(r.createdAt) };
      })});
    }

    var stillLoading = ["users","orders","trucks","reports"].some(function(n){
      return can(RESOURCES[n].perm) && Store.state[n] === "loading";
    });

    box.hidden = false;
    if(!groups.length){
      box.innerHTML = '<div class="tb-empty">'
        + (stillLoading ? "Yuklanmoqda…" : "\"" + esc(raw) + "\" bo'yicha hech narsa topilmadi.") + '</div>';
      return;
    }
    box.innerHTML = groups.map(function(g){
      return '<div class="tb-res-group">' + esc(g.label) + '</div>' + g.items.map(function(it){
        return '<button type="button" class="tb-res" data-act="go" data-hash="' + esc(it.hash) + '">'
          + esc(it.title) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : "") + '</button>';
      }).join("");
    }).join("");
  }
  var globalSearchDebounced = debounce(function(v){ runGlobalSearch(v); }, 250);

  function closeGlobalSearch(){
    byId("globalResults").hidden = true;
  }

    shell.classList.toggle("collapsed");
    try { localStorage.setItem("yoldaAdminCollapsed", shell.classList.contains("collapsed") ? "1" : "0"); }

  /* ==========================================================

      + ico("back") + esc(label) + '</button>';

  function stat(label, value, sub, icon, tone){
    return '<div class="stat">'
      + '<div class="stat-top"><span class="stat-ico ' + (tone || "") + '">' + ico(icon) + '</span>'
      + esc(label) + '</div>'

      + '<div class="stat-sub">' + esc(sub || "") + '</div></div>';

  function card(title, bodyHtml, note){
    return '<div class="card card-pad"><h2 class="card-title">' + esc(title)
      + (note ? '<small>' + esc(note) + '</small>' : "") + '</h2>' + bodyHtml + '</div>';

  /** An order counts as a trip once a driver has taken it. */
  function isTrip(o){ return Boolean(o && o.driver && (o.driver.name || o.driver.phone)); }

  /* ==========================================================
     17. Dashboard
     Every number here is computed from the rows the API returned.
     Nothing on this screen is a constant.
     ========================================================== */
  function viewDashboard(){
    var need = [];
    ["orders","users","trucks","reports"].forEach(function(n){
      if(can(RESOURCES[n].perm)) need.push(n);
    });
    if(!need.length){
      return pageHead("Boshqaruv paneli", "")
        + stateBox("lock", "Ko'rsatadigan ma'lumot yo'q", "Rolingizga hech qanday bo'lim ochiq emas.");
    }

    return pageHead("Boshqaruv paneli", "Platformaning bugungi holati", refreshBtn("all"))
      + withData(need, function(){
        var orders = Store.list("orders");
        var users = Store.list("users");
        var trucks = Store.list("trucks");
        var reports = Store.list("reports");
        var weekAgo = Date.now() - 7 * 86400000;

        /* --- KPI cards --- */
        var cards = "";
        if(can("orders:read")){
          var week = orders.filter(function(o){ return (o.createdAt || 0) >= weekAgo; }).length;
          var delivered = orders.filter(function(o){ return o.status === "DELIVERED"; }).length;
          var trips = orders.filter(isTrip).length;
          var revenue = orders.reduce(function(s, o){ return s + (Number(o.amount) || 0); }, 0);
          cards += stat("Buyurtmalar", fmt(orders.length), week + " ta so'nggi 7 kunda", "box");
          cards += stat("Safarlar", fmt(trips),
            pct(trips, orders.length) + "% buyurtma haydovchi topgan", "route");
          cards += stat("Yetkazilgan", fmt(delivered),
            pct(delivered, orders.length) + "% barcha buyurtmalardan", "check", "ok");
          cards += stat("Buyurtmalar qiymati", fmt(revenue),
            "so'm — e'lon qilingan narxlar yig'indisi", "box");
        }
        if(can("users:read")){
          var drivers = users.filter(function(u){ return u.role === "DRIVER" || u.role === "BOTH"; }).length;
          var verified = users.filter(function(u){ return u.verified; }).length;
          cards += stat("Foydalanuvchilar", fmt(users.length), drivers + " ta haydovchi", "users");
          cards += stat("Tasdiqlangan", fmt(verified),
            pct(verified, users.length) + "% profil tasdiqlangan", "shield", "ok");
        }
        if(can("trucks:read")){
          var pending = trucks.filter(function(t){ return truckStatus(t) === "PENDING"; }).length;
          var active = trucks.filter(function(t){ return truckStatus(t) === "ACTIVE"; }).length;
          cards += stat("Tekshiruvdagi e'lonlar", fmt(pending),
            pending ? "Ko'rib chiqish kutilmoqda" : "Navbat bo'sh", "clock", pending ? "warn" : "");
          cards += stat("Faol e'lonlar", fmt(active), trucks.length + " ta e'londan", "car");
        }
        if(can("reports:read")){
          var newRep = reports.filter(function(r){ return (r.status || "NEW") === "NEW"; }).length;
          cards += stat("Yangi shikoyatlar", fmt(newRep),
            reports.length + " ta jami shikoyat", "flag", newRep ? "bad" : "");
        }

        var html = '<div class="stat-grid">' + cards + '</div>';

        /* --- 14-day activity --- */
        var days = lastDays(14);
        var series = [];
        if(can("orders:read")){
          series.push({ label:"Buyurtmalar", color:"#4F8CFF",
            values: countInDays(orders, days, function(o){ return o.createdAt || 0; }) });
        }
        if(can("trucks:read")){
          series.push({ label:"Mashina e'lonlari", color:"#38BDF8",
            values: countInDays(trucks, days, function(t){ return t.createdAt || 0; }) });
        }
        var chartCard = series.length
          ? card("So'nggi 14 kun faolligi", barChart(days.map(function(d){ return d.label; }), series))
          : "";

        /* --- City activity. The records store city names, not
               coordinates, so this is a ranked breakdown rather than a
               map — it's the real geography the data actually has. --- */
        var cityCard = "";
        if(can("orders:read")){
          var cityCounts = {};
          orders.forEach(function(o){
            if(o.fromCity) cityCounts[o.fromCity] = (cityCounts[o.fromCity] || 0) + 1;
            if(o.toCity) cityCounts[o.toCity] = (cityCounts[o.toCity] || 0) + 1;
          });
          var cityItems = Object.keys(cityCounts).map(function(c){ return { label:c, value:cityCounts[c] }; });
          cityItems.sort(function(a, b){ return b.value - a.value; });
          cityCard = card("Shaharlar bo'yicha faollik", hbars(cityItems.slice(0, 8)),
            "jo'natish + yetkazish");
        }
        if(chartCard || cityCard) html += '<div class="grid-2">' + chartCard + cityCard + '</div>';

        /* --- Work queues --- */
        var left = "", right = "";
        if(can("orders:read")){
          var recent = orders.slice().sort(function(a, b){
            return (b.createdAt || 0) - (a.createdAt || 0);
          }).slice(0, 6);
          left = card("So'nggi buyurtmalar", recent.length ? miniOrderList(recent)
            : '<p style="color:var(--text-dim);font-size:13px;margin:0;">Hozircha buyurtma yo\'q.</p>');
        }
        if(can("trucks:read")){
          var queue = trucks.filter(function(t){ return truckStatus(t) === "PENDING"; });
          // The note counts the whole queue, not the handful shown — a
          // preview that renamed itself "6 ta kutmoqda" would understate
          // the real backlog.
          right = card("Tekshiruv navbati", queue.length
            ? miniTruckList(queue.slice(0, 6))
              + (queue.length > 6
                  ? '<button type="button" class="btn sm" style="margin-top:12px;" data-act="go" '
                    + 'data-hash="#/trucks">Barchasini ko\'rish (' + queue.length + ')</button>'
                  : "")
            : '<p style="color:var(--text-dim);font-size:13px;margin:0;">Navbat bo\'sh — hammasi ko\'rib chiqilgan.</p>',
            queue.length ? queue.length + " ta kutmoqda" : "");
        }
        if(left || right) html += '<div class="grid-2-even">' + left + right + '</div>';

        return html;
      });
  }

  /* ==========================================================
     21. Tasdiqlashlar — profile verification requests.
     A request is a real field the user sets from their profile
     (api/profile.js ?action=request-verification); approving it
     is the same verify-driver call the Users screen makes.
     ========================================================== */
  /* Uch xil tasdiq (lib/verification.js). Jadval endi foydalanuvchi
     bo'yicha emas, so'rov bo'yicha: bitta odamning shaxs hujjati
     tasdiqlangan-u, texnik pasporti kutilayotgan bo'lishi mumkin, va
     bitta qatorda bu ikkisini ko'rsatib bo'lmasdi. */
  var VERIFY_KIND_LABELS = {
    PHONE: "Telefon raqami", IDENTITY: "Shaxs hujjati", TRANSPORT: "Texnik pasport"
  };
  var VERIFY_REVIEWED_KINDS = ["IDENTITY", "TRANSPORT"];
  var VERIFY_ALL_KINDS = ["PHONE", "IDENTITY", "TRANSPORT"];
  var VERIFY_ST_PILL = {
    VERIFIED: ["Tasdiqlangan", "pill-ok"], PENDING: ["Kutilmoqda", "pill-warn"],
    REJECTED: ["Rad etilgan", "pill-bad"], NONE: ["Tasdiqlanmagan", "pill-dim"]
  };

  /** Eski yozuvlarni ham to'g'ri o'qiydi — serverdagi readVerifications bilan bir xil qoida. */
  function verifyStateOf(u, kind){
    var all = (u && u.verifications) || {};
    var e = all[kind];
    if(e && e.status) return e;
    if(kind === "IDENTITY"){
      if(u && u.verified) return { status:"VERIFIED", at:0, reviewedAt:0, reason:"" };
      if(u && u.verificationRequestedAt) return { status:"PENDING", at:u.verificationRequestedAt, reviewedAt:0, reason:"" };
    }
    return { status:"NONE", at:0, reviewedAt:0, reason:"" };
  }

  /** Har bir foydalanuvchi × har bir tur = bitta qator. */
  function verificationRows(users){
    var rows = [];
    users.forEach(function(u){
      VERIFY_ALL_KINDS.forEach(function(kind){
        var st = verifyStateOf(u, kind);
        if(st.status === "NONE" && kind !== "IDENTITY") return;
        rows.push({
          id: u.email + "|" + kind,
          user: u, kind: kind, status: st.status,
          at: st.at || 0, reviewedAt: st.reviewedAt || 0, reason: st.reason || ""
        });
      });
    });
    return rows;
  }

        var pending = rows.filter(function(r){ return r.status === "PENDING"; });

        var phoneOk = rows.filter(function(r){ return r.kind === "PHONE" && r.status === "VERIFIED"; });

        var stats = '<div class="stat-grid">'

          + stat("Raqami tasdiqlangan", fmt(phoneOk.length),
              "Telegram orqali avtomatik", "users")
          + '</div>';

        return stats + dataTable({
          id: "verifications",
          defaults: { sortKey:"at", sortDir:"desc", filter:"PENDING" },
          rows: rows,
          unit: "so'rov",
          searchPlaceholder: "Username, email, telefon…",

          },
          filters: [
            { key:"PENDING", label:"Kutilmoqda", count:pending.length },
            { key:"VERIFIED", label:"Tasdiqlangan", count:verified.length },
            { key:"REJECTED", label:"Rad etilgan",
              count:rows.filter(function(r){ return r.status === "REJECTED"; }).length },
            { key:"ALL", label:"Barchasi" }
          ],
          filterFn: function(r, f){ return r.status === f; },
          emptyTitle: "So'rov yo'q",
          emptyText: "Foydalanuvchi profilidan tasdiqlash so'raganda so'rov shu yerga tushadi.",
          columns: [
            { key:"username", label:"Foydalanuvchi", sortable:true,
              value:function(r){ return r.user.username || r.user.email || ""; },

              } },

              value:function(r){ return VERIFY_KIND_LABELS[r.kind] || r.kind; },
              render:function(r){ return esc(VERIFY_KIND_LABELS[r.kind] || r.kind); } },
            { key:"role", label:"Rol", sortable:true, cls:"dim",
              value:function(r){ return ROLE_LABELS[r.user.role] || ""; },
              render:function(r){ return esc(ROLE_LABELS[r.user.role] || "—"); } },
            { key:"phone", label:"Telefon", cls:"dim",
              render:function(r){ return esc(r.user.phone || "—"); } },
            { key:"vehicle", label:"Mashina", cls:"dim",
              render:function(r){
                var v = VEHICLE_LABELS[r.user.vehicleType] || "";
                return esc([v, r.user.plateNumber].filter(Boolean).join(" · ") || "—");

            { key:"at", label:"So'rov vaqti", sortable:true, cls:"dim",
              value:function(r){ return r.at; },
              render:function(r){ return r.at ? esc(relTime(r.at)) : "—"; } },
            { key:"status", label:"Holat", sortable:true,
              value:function(r){ return r.status; },
              render:function(r){
                var p = VERIFY_ST_PILL[r.status] || VERIFY_ST_PILL.NONE;
                return pill(p[0], p[1])
                  + (r.reason ? '<br><span style="color:var(--text-dim);font-size:11.5px;">' + esc(r.reason) + '</span>' : "");
              } },
            { key:"actions", label:"Amal",

                  out += '<span style="color:var(--text-dim);font-size:11.5px;">Telegram orqali</span>';
                } else if(r.status === "PENDING"){
                  out += '<button type="button" class="btn sm primary" data-act="verify-doc" data-email="'
                    + esc(r.user.email) + '" data-kind="' + esc(r.kind) + '">'
                    + ico("shield") + 'Hujjatni ko\'rish</button>';
                } else if(r.status === "VERIFIED"){
                  out += '<button type="button" class="btn sm bad" data-act="verify-set" data-email="'
                    + esc(r.user.email) + '" data-kind="' + esc(r.kind) + '" data-on="0">Bekor qilish</button>';
                } else {
                  out += '<button type="button" class="btn sm ok" data-act="verify-set" data-email="'
                    + esc(r.user.email) + '" data-kind="' + esc(r.kind) + '" data-on="1">'
                    + ico("check") + 'Tasdiqlash</button>';
                }
                out += '<button type="button" class="btn sm" data-act="go" data-hash="#/users/'
                  + esc(encodeURIComponent(r.user.email)) + '">Profil</button>';
                return out + '</div>';
              } }
          ]
        });
      });
  }

  /**
   * Hujjatni ochib, qaror qabul qilish oynasi.
   *
   * Hujjat alohida so'rov bilan olinadi — u foydalanuvchilar
   * ro'yxatida yuborilmaydi, aks holda har bir jadval yuklanishida
   * o'nlab pasport rasmi brauzerga oqib kelardi.
   */
  function openVerifyDoc(email, kind){
    openModal({
      title: (VERIFY_KIND_LABELS[kind] || kind) + " — " + email,
      body: '<p class="dim">Yuklanmoqda…</p>',
      foot: '<button type="button" class="btn" data-act="modal-close">Yopish</button>'
    });
    Api.get("resource=verifydoc&email=" + encodeURIComponent(email) + "&kind=" + encodeURIComponent(kind))
      .then(function(res){
        byId("modalBody").innerHTML =
          '<img src="' + esc(res.doc) + '" alt="" style="width:100%;border-radius:8px;display:block;">'
          + '<div class="field" style="margin-top:14px;">'
          +   '<label for="verifyReason">Rad etish sababi (rad etsangiz majburiy)</label>'
          +   '<input type="text" id="verifyReason" maxlength="200" placeholder="Masalan: rasm noaniq">'
          + '</div>'
          + '<p class="dim" style="margin:8px 0 0;font-size:12px;">Qaror chiqqach hujjat o\'chiriladi.</p>';
        byId("modalFoot").innerHTML =
          '<button type="button" class="btn" data-act="modal-close">Yopish</button>'
          + '<button type="button" class="btn bad" data-act="verify-decide" data-email="' + esc(email)
          +   '" data-kind="' + esc(kind) + '" data-on="0">Rad etish</button>'
          + '<button type="button" class="btn primary" data-act="verify-decide" data-email="' + esc(email)
          +   '" data-kind="' + esc(kind) + '" data-on="1">Tasdiqlash</button>';
      })
      .catch(function(err){
        byId("modalBody").innerHTML = '<p class="dim">' + esc(err.message) + '</p>';
      });
  }

  function decideVerification(email, kind, approve){
    var reasonEl = byId("verifyReason");
    var reason = reasonEl ? reasonEl.value.trim() : "";
    if(!approve && !reason){
      toast("Rad etish sababini yozing", "bad");
      if(reasonEl) reasonEl.focus();
      return;
    }
    Api.post("verify-review", { email: email, kind: kind, approve: approve, reason: reason })
      .then(function(){
        closeModal();
        toast(approve ? "Tasdiqlandi" : "Rad etildi");
        Store.load("users", true);
      })
      .catch(function(err){
        if(handleApiError(err)) return;
        toast(err.message, "bad");
      });
  }

  /**
   * Hujjatsiz to'g'ridan-to'g'ri qo'yish/olib tashlash — allaqachon
   * ko'rib chiqilgan tasdiqni qaytarish uchun.
   */
  function setVerificationKind(email, kind, approve){
    Api.post("verify-review", {
      email: email, kind: kind, approve: approve,
      reason: approve ? "" : "Administrator bekor qildi"
    }).then(function(){
      toast(approve ? "Tasdiqlandi" : "Tasdiq bekor qilindi");
      Store.load("users", true);
    }).catch(function(err){
      if(handleApiError(err)) return;
      toast(err.message, "bad");
    });
  }
