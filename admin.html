  /* ==========================================================
     25. Tahlil — the same records, aggregated. Every series is
     built from real rows; a resource with no data renders an
     empty state instead of an invented trend.
     ========================================================== */
  function viewAnalytics(){
    var need = [];
    ["orders","users","trucks","reports"].forEach(function(n){
      if(can(RESOURCES[n].perm)) need.push(n);
    });
    if(!need.length){
      return pageHead("Tahlil", "") + stateBox("lock", "Ruxsat yo'q", "Bu bo'lim sizning rolingizga ochiq emas.");
    }

    return pageHead("Tahlil", "Platforma ma'lumotlari bo'yicha hisobot", refreshBtn("all"))
      + withData(need, function(){
        var orders = Store.list("orders");
        var users = Store.list("users");
        var trucks = Store.list("trucks");
        var reports = Store.list("reports");
        var html = "";

        /* 30-day trend */
        var days30 = lastDays(30);
        var series = [];
        if(can("orders:read")){
          series.push({ label:"Buyurtmalar", color:"#4F8CFF",
            values: countInDays(orders, days30, function(o){ return o.createdAt || 0; }) });
        }
        if(can("trucks:read")){
          series.push({ label:"E'lonlar", color:"#38BDF8",
            values: countInDays(trucks, days30, function(t){ return t.createdAt || 0; }) });
        }
        if(can("users:read")){
          var withJoin = users.filter(function(u){ return u.joinedAt; });
          if(withJoin.length){
            series.push({ label:"Yangi profillar", color:"#22C55E",
              values: countInDays(withJoin, days30, function(u){ return u.joinedAt; }) });
          }
        }
        if(series.length){
          html += card("So'nggi 30 kun", barChart(days30.map(function(d){ return d.label; }), series));
        }

        /* Orders breakdown */
        if(can("orders:read")){
          var routeCounts = rank(orders, function(o){
            return o.fromCity && o.toCity ? o.fromCity + " → " + o.toCity : "";
          }, null, 8);
          var cargoCounts = rank(orders, function(o){ return cargoLabel(o); }, null, 8);
          var statusCounts = rank(orders, function(o){ return o.status || "NEW"; },
            function(k){ return ORDER_LABELS[k] || k; });
          html += '<div class="grid-2-even">'
            + card("Eng ko'p yo'nalishlar", hbars(routeCounts))
            + card("Yuk turlari", hbars(cargoCounts, "#38BDF8"))
            + '</div>'
            + '<div class="grid-2-even">'
            + card("Buyurtma holatlari", hbars(statusCounts, "#22C55E"))
            + card("Buyurtma qiymatlari", ordersValueSummary(orders))
            + '</div>';
        }

        /* Users + listings breakdown */
        var pairA = "", pairB = "";
        if(can("users:read")){
          pairA = card("Foydalanuvchi rollari",
            hbars(rank(users, function(u){ return u.role || ""; },
              function(k){ return ROLE_LABELS[k] || k; })));
        }
        if(can("trucks:read")){
          pairB = card("E'lon turkumlari",
            hbars(rank(trucks, function(t){ return t.category || ""; },
              function(k){ return TRUCK_CAT_LABELS[k] || k; }, 8), "#38BDF8"));
        }
        if(pairA || pairB) html += '<div class="grid-2-even">' + pairA + pairB + '</div>';

        var pairC = "", pairD = "";
        if(can("users:read")){
          pairC = card("Shaharlar (foydalanuvchilar)",
            hbars(rank(users, function(u){ return u.city || ""; }, null, 8), "#A78BFA"));
        }
        if(can("reports:read")){
          pairD = card("Shikoyat sabablari",
            hbars(rank(reports, function(r){ return r.reason || ""; },
              function(k){ return REASON_LABELS[k] || k; }, 8), "#EF4444"));
        }
        if(pairC || pairD) html += '<div class="grid-2-even">' + pairC + pairD + '</div>';

        return html || stateBox("empty", "Ma'lumot yo'q", "Tahlil qilish uchun hali yetarli yozuv yo'q.");
      });
  }

  /** Min / median / max of the prices people actually posted. */
  function ordersValueSummary(orders){
    var values = orders.map(function(o){ return Number(o.amount) || 0; })
      .filter(function(v){ return v > 0; })
      .sort(function(a, b){ return a - b; });
    if(!values.length){
      return '<p style="color:var(--text-dim);font-size:13px;margin:0;">Narxli buyurtma yo\'q.</p>';
    }
    var sum = values.reduce(function(a, b){ return a + b; }, 0);
    var mid = Math.floor(values.length / 2);
    var median = values.length % 2 ? values[mid] : Math.round((values[mid - 1] + values[mid]) / 2);
    return '<dl class="kv">'
      + kvRow("Jami", '<b>' + esc(money(sum)) + '</b>')
      + kvRow("O'rtacha", esc(money(Math.round(sum / values.length))))
      + kvRow("Mediana", esc(money(median)))
      + kvRow("Eng past", esc(money(values[0])))
      + kvRow("Eng yuqori", esc(money(values[values.length - 1])))
      + kvRow("Hisobga olingan", fmt(values.length) + " ta buyurtma")
      + '</dl>';
  }

  function saveSettings(){
    var payload = {
      platformName: byId("setName").value.trim(),
      supportPhone: byId("setPhone").value.trim(),
      supportTelegram: byId("setTg").value.trim(),
      commissionPercent: Number(byId("setCommission").value),
      maintenanceMode: byId("setMaint").checked,
      maintenanceMessage: byId("setMaintMsg").value.trim()
    };
    if(!isFinite(payload.commissionPercent) || payload.commissionPercent < 0 || payload.commissionPercent > 100){
      toast("Komissiya 0–100 oralig'ida bo'lishi kerak", "bad");
      return;
    }
    Api.post("update-settings", payload).then(function(body){
      Store.data.settings = body.settings;
      Store.state.settings = "ready";
      toast("Sozlamalar saqlandi");
      render();
    }).catch(function(err){
      if(handleApiError(err)) return;
      toast(err.message, "bad");
    });
  }

  /* ==========================================================
     27. Mutations
     Each one waits for the server, reports what really happened,
     and refreshes from the API rather than guessing locally.
     ========================================================== */
  function afterTruckChange(id){
    if(id) delete oneOff["truck:" + id];
    Store.load("trucks", true);
    if(current.name === "trucks" && current.param){
      loadOne("truck:" + current.param, "resource=truck&id=" + encodeURIComponent(current.param),
        function(b){ return b.truck; });
    }
  }
  function updateTruck(payload, successMsg){
    Api.post("update-truck", payload).then(function(){
      toast(successMsg || "Saqlandi");
      if(payload.remove && current.name === "trucks" && current.param === payload.id){
        delete oneOff["truck:" + payload.id];
        Store.load("trucks", true);
        go("#/trucks");
        return;
      }
      afterTruckChange(payload.id);
    }).catch(function(err){
      if(handleApiError(err)) return;
      toast(err.message, "bad");
      afterTruckChange(payload.id);
    });
  }

  }

  function confirmRemoveTruck(id){
    openModal({
      title: "E'lonni o'chirish",
      body: '<p style="margin:0;color:var(--text-soft);font-size:13.5px;">'
        + 'E\'lon butunlay o\'chiriladi va uni qaytarib bo\'lmaydi. Davom etasizmi?</p>',
      foot: '<button type="button" class="btn" data-act="modal-close">Bekor qilish</button>'
        + '<button type="button" class="btn bad" data-act="modal-save">O\'chirish</button>',
      onSave: function(){
        closeModal();
        updateTruck({ id:id, remove:true }, "E'lon o'chirildi");
      }
    });
  }

  /**
   * Moderatsiyadan oldin joylangan e'lonlarni bir marta tekshiruvga
   * qaytaradi. Nechta e'longa tegishini oldindan aytadi — admin nimaga
   * rozi bo'layotganini ko'rib turishi kerak.
   */
  function confirmRequeueLegacy(){
    var list = Store.list("trucks").filter(isUnreviewedLegacy);
    openModal({
      title: "Eski e'lonlarni tekshiruvga qaytarish",
      body: '<p style="margin:0 0 14px;color:var(--text-soft);font-size:13.5px;">'
        + '<b>' + list.length + " ta</b> e'lon moderatsiya joriy qilinishidan oldin "
        + "joylangan va hech kim ularni ko'rib chiqmagan — ular saytga o'z-o'zidan chiqib ketgan."
        + '</p>'
        + '<p style="margin:0 0 14px;color:var(--text-soft);font-size:13.5px;">'
        + "Ular <b>Tekshiruvda</b> holatiga o'tadi va siz tasdiqlamaguningizcha saytda ko'rinmaydi. "
        + "Sotuvchi e'lonini o'chirmaydi — u o'z kabinetida qoladi."
        + '</p>'
        + (list.length
            ? '<div class="table-wrap"><div class="table-scroll"><table><tbody>'
              + list.slice(0, 8).map(function(t){
                  return '<tr><td><b>' + esc(t.brand) + '</b></td><td class="dim">'
                    + esc(t.city) + '</td><td class="dim">' + esc(dateOnly(t.createdAt)) + '</td></tr>';
                }).join("")
              + '</tbody></table></div></div>'
              + (list.length > 8
                  ? '<p style="color:var(--text-dim);font-size:12px;margin:10px 0 0;">…va yana '
                    + (list.length - 8) + ' ta</p>'
                  : "")
            : ""),
      foot: '<button type="button" class="btn" data-act="modal-close">Bekor qilish</button>'
        + '<button type="button" class="btn primary" data-act="modal-save"'
        + (list.length ? "" : " disabled") + '>Tekshiruvga qaytarish</button>',
      onSave: function(){
        var btn = byId("modalFoot").querySelector('[data-act="modal-save"]');
        if(btn) btn.disabled = true;
        Api.post("requeue-legacy", { confirm: true }).then(function(body){
          closeModal();
          toast(body.requeued + " ta e'lon tekshiruvga qaytarildi");
          Store.load("trucks", true);
        }).catch(function(err){
          if(btn) btn.disabled = false;
          if(handleApiError(err)) return;
          toast(err.message, "bad");
        });
      }
    });
  }

  function setVerified(email, verified){
    Api.post("verify-driver", { email:email, verified:verified }).then(function(){
      toast(verified ? "Profil tasdiqlandi" : "Tasdiq bekor qilindi");
      Store.load("users", true);
    }).catch(function(err){
      if(handleApiError(err)) return;
      toast(err.message, "bad");
    });
  }

  function setReportStatus(id, status){
    Api.post("update-report", { id:id, status:status }).then(function(){
      toast("Shikoyat holati yangilandi"
        + (status === "BANNED" ? " — aloqa ma'lumoti bloklandi" : ""));
      Store.load("reports", true);
    }).catch(function(err){
      if(handleApiError(err)) return;
      toast(err.message, "bad");
      Store.load("reports", true);
    });
  }

  /* ---------- User edit modal ---------- */
  function openUserModal(email){
    var user = null;
    Store.list("users").forEach(function(u){ if(u.email === email) user = u; });
    if(!user) return;

    function opts(list, selected, labels){
      return '<option value="">Tanlanmagan</option>' + list.map(function(v){
        return '<option value="' + esc(v) + '"' + (selected === v ? " selected" : "") + '>'
          + esc(labels ? labels[v] : v) + '</option>';
      }).join("");
    }

    openModal({
      title: "Tahrirlash: " + (user.username ? "@" + user.username : user.email),
      body:
        '<div class="field"><label>Email / ID (o\'zgarmas)</label>'
        + '<input type="text" value="' + esc(user.email) + '" disabled></div>'
        + '<div class="row2">'
        + '<div class="field"><label for="umUsername">Username</label>'
        + '<input type="text" id="umUsername" maxlength="20" value="' + esc(user.username || "") + '"></div>'
        + '<div class="field"><label for="umDisplayName">Ism</label>'
        + '<input type="text" id="umDisplayName" maxlength="60" value="' + esc(user.displayName || "") + '"></div>'
        + '</div>'
        + '<div class="row2">'
        + '<div class="field"><label for="umRole">Rol</label>'
        + '<select id="umRole">' + opts(["DRIVER","OWNER","BOTH"], user.role, ROLE_LABELS) + '</select></div>'
        + '<div class="field"><label for="umCity">Shahar</label>'
        + '<select id="umCity">' + opts(CITIES, user.city) + '</select></div>'
        + '</div>'
        + '<div class="row2">'
        + '<div class="field"><label for="umPhone">Telefon</label>'
        + '<input type="text" id="umPhone" placeholder="+998901234567" value="' + esc(user.phone || "") + '"></div>'
        + '<div class="field"><label for="umTelegram">Telegram username</label>'
        + '<input type="text" id="umTelegram" placeholder="username" value="' + esc(user.telegramUsername || "") + '"></div>'
        + '</div>'
        + '<div class="row2">'
        + '<div class="field"><label for="umVehicleType">Mashina turi</label>'
        + '<select id="umVehicleType">'
        + opts(["ISUZU","GAZEL","FURGON","YARIM_TREYLER","SAMOSVAL","BOSHQA"], user.vehicleType, VEHICLE_LABELS)
        + '</select></div>'
        + '<div class="field"><label for="umPlateNumber">Davlat raqami</label>'
        + '<input type="text" id="umPlateNumber" maxlength="12" value="' + esc(user.plateNumber || "") + '"></div>'
        + '</div>'
        + '<div class="field"><label for="umBio">Bio</label>'
        + '<textarea id="umBio" maxlength="200">' + esc(user.bio || "") + '</textarea></div>'
        + '<div class="row2">'
        + '<div class="field"><label for="umRatingCount">Baholar soni</label>'
        + '<input type="number" id="umRatingCount" min="0" step="1" value="' + (user.ratingCount || 0) + '"></div>'
        + '<div class="field"><label for="umRatingSum">Baholar yig\'indisi</label>'
        + '<input type="number" id="umRatingSum" min="0" step="1" value="' + (user.ratingSum || 0) + '"></div>'
        + '</div>'
        + '<label class="check"><input type="checkbox" id="umVerified"' + (user.verified ? " checked" : "")
        + '> Tasdiqlangan profil</label>'
        + '<label class="check"><input type="checkbox" id="umBanned"' + (user.banned ? " checked" : "")
        + '> Bloklangan (saytdan foydalana olmaydi)</label>'
        + '<p class="form-err" id="umErr"></p>',
      onSave: function(){ saveUserEdit(user.email); }
    });
  }

  function saveUserEdit(email){
    var ratingCount = parseInt(byId("umRatingCount").value, 10);
    var ratingSum = parseInt(byId("umRatingSum").value, 10);
    var payload = {
      email: email,
      username: byId("umUsername").value.trim(),
      displayName: byId("umDisplayName").value.trim(),
      role: byId("umRole").value,
      city: byId("umCity").value,
      phone: byId("umPhone").value.trim(),
      telegramUsername: byId("umTelegram").value.trim(),
      vehicleType: byId("umVehicleType").value,
      plateNumber: byId("umPlateNumber").value.trim(),
      bio: byId("umBio").value.trim(),
      ratingCount: isNaN(ratingCount) ? 0 : ratingCount,
      ratingSum: isNaN(ratingSum) ? 0 : ratingSum,
      verified: byId("umVerified").checked,
      banned: byId("umBanned").checked
    };
    var saveBtn = byId("modalFoot").querySelector('[data-act="modal-save"]');
    if(saveBtn) saveBtn.disabled = true;

    Api.post("update-user", payload).then(function(){
      closeModal();
      toast("Foydalanuvchi saqlandi");
      Store.load("users", true);
    }).catch(function(err){
      if(saveBtn) saveBtn.disabled = false;
      if(handleApiError(err)) return;
      var errEl = byId("umErr");
      if(errEl) errEl.textContent = err.message;
      else toast(err.message, "bad");
    });
  }

  /* ==========================================================
     28. Event wiring — one delegated listener for the whole panel
     ========================================================== */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]");
    if(!t) {
      // A click anywhere else closes the search dropdown.
      if(!e.target.closest(".tb-search")) closeGlobalSearch();
      return;
    }
    var act = t.getAttribute("data-act");

    if(act === "nav"){ go("#/" + t.getAttribute("data-name")); return; }
    if(act === "go"){ closeGlobalSearch(); go(t.getAttribute("data-hash")); return; }

    if(act === "reload"){
      var name = t.getAttribute("data-name");
      t.classList.add("spinning");
      var done = function(){ t.classList.remove("spinning"); };
      (name === "all" ? Store.reloadAll() : Store.load(name, true)).then(done, done);
      return;
    }

    if(act === "table-sort"){
      var st = tState(t.getAttribute("data-id"));
      var key = t.getAttribute("data-key");
      if(st.sortKey === key) st.sortDir = st.sortDir === "asc" ? "desc" : "asc";
      else { st.sortKey = key; st.sortDir = "asc"; }
      st.page = 1;
      render();
      return;
    }
    if(act === "table-filter"){
      var stf = tState(t.getAttribute("data-id"));
      stf.filter = t.getAttribute("data-filter");
      stf.page = 1;
      render();
      return;
    }
    if(act === "table-page"){
      var stp = tState(t.getAttribute("data-id"));
      stp.page = Number(t.getAttribute("data-page")) || 1;
      render();
      window.scrollTo(0, 0);
      return;
    }

    if(act === "truck-approve"){ updateTruck({ id:t.getAttribute("data-id"), status:"ACTIVE" }, "E'lon tasdiqlandi"); return; }
    if(act === "truck-reject"){ askRejectReason(t.getAttribute("data-id")); return; }
    if(act === "truck-verify"){
      updateTruck({ id:t.getAttribute("data-id"), verified: t.getAttribute("data-on") !== "1" });
      return;
    }
    if(act === "truck-promote"){
      updateTruck({ id:t.getAttribute("data-id"), promoted: t.getAttribute("data-on") !== "1" });
      return;
    }
    if(act === "truck-remove"){ confirmRemoveTruck(t.getAttribute("data-id")); return; }

    if(act === "verify"){ setVerified(t.getAttribute("data-email"), t.getAttribute("data-on") === "1"); return; }
    if(act === "verify-doc"){ openVerifyDoc(t.getAttribute("data-email"), t.getAttribute("data-kind")); return; }
    if(act === "verify-set"){
      setVerificationKind(t.getAttribute("data-email"), t.getAttribute("data-kind"), t.getAttribute("data-on") === "1");
      return;
    }
    if(act === "verify-decide"){
      decideVerification(t.getAttribute("data-email"), t.getAttribute("data-kind"), t.getAttribute("data-on") === "1");
      return;
    }
    if(act === "user-edit"){ openUserModal(t.getAttribute("data-email")); return; }
    if(act === "settings-save"){ saveSettings(); return; }
    if(act === "requeue-legacy"){ confirmRequeueLegacy(); return; }

    if(act === "modal-close"){ closeModal(); return; }
    if(act === "modal-save"){ if(modalOnSave) modalOnSave(); return; }
    if(act === "logout"){ doLogout(); return; }
  });

  document.addEventListener("change", function(e){
    var t = e.target.closest("[data-act]");
    if(!t) return;
    var act = t.getAttribute("data-act");
    if(act === "report-status"){ setReportStatus(t.getAttribute("data-id"), t.value); return; }
    if(act === "truck-status"){ updateTruck({ id:t.getAttribute("data-id"), status:t.value }, "Holat yangilandi"); return; }
  });

  /* Table search: keep focus and caret while re-rendering. */
  document.addEventListener("input", function(e){
    var t = e.target.closest('[data-act="table-search"]');
    if(!t) return;
    var id = t.getAttribute("data-id");
    var st = tState(id);
    st.q = t.value;
    st.page = 1;
    render();
    var again = document.querySelector('[data-act="table-search"][data-id="' + id + '"]');
    if(again){
      again.focus();
      again.setSelectionRange(again.value.length, again.value.length);
    }
  });

  byId("globalSearch").addEventListener("input", function(){
    globalSearchDebounced(this.value);
  });
  byId("globalSearch").addEventListener("focus", function(){
    if(this.value.trim().length >= 2) runGlobalSearch(this.value);
  });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!byId("modalBackdrop").hidden){ closeModal(); return; }
    if(!byId("globalResults").hidden){ closeGlobalSearch(); return; }
    closeDrawer();
  });

  byId("modalBackdrop").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
  byId("modalX").addEventListener("click", closeModal);
  byId("sbCollapse").addEventListener("click", toggleCollapse);
  byId("tbBurger").addEventListener("click", toggleDrawer);
  byId("sbScrim").addEventListener("click", closeDrawer);

  byId("pwToggle").addEventListener("click", function(){
    var pwInput = byId("pw");
    var showing = pwInput.type === "text";
    pwInput.type = showing ? "password" : "text";
    this.setAttribute("aria-label", showing ? "Parolni ko'rsatish" : "Parolni yashirish");
  });

  /* ==========================================================
     29. Session lifecycle
     ========================================================== */
  function startSession(role){
    session.role = role;
    Store.reset();
    tableState = {};
    byId("loginBox").hidden = true;
    byId("adminShell").hidden = false;
    byId("pw").value = "";
    byId("loginErr").textContent = "";

    try {
      if(localStorage.getItem("yoldaAdminCollapsed") === "1") byId("adminShell").classList.add("collapsed");
    } catch(e){ /* private mode */ }

    // Sidebar badges are real counts, so the resources behind them are
    // fetched up front rather than only when you open the screen.
    ["trucks","reports","users"].forEach(function(n){ if(can(RESOURCES[n].perm)) Store.load(n); });

    onHashChange();
    if(!current.name){
      var first = firstAllowedRoute();
      if(first) go("#/" + first);
    }
  }

  /**
   * Ends the session in the browser: every cached row is dropped and the
   * panel is replaced by the login screen, so pressing Back can't show
   * data from a session that no longer exists.
   */
  function endSession(expired){
    session.role = null;
    Store.reset();
    tableState = {};
    current = { name:null, param:null };
    closeModal();
    closeGlobalSearch();
    closeDrawer();
    byId("globalSearch").value = "";
    byId("adminMain").innerHTML = "";
    byId("sbNav").innerHTML = "";
    byId("sbFoot").innerHTML = "";
    byId("adminShell").hidden = true;
    byId("loginBox").hidden = false;
    byId("pw").value = "";
    if(location.hash) history.replaceState(null, "", location.pathname + location.search);
    if(expired) byId("loginErr").textContent = "Sessiya tugadi. Qaytadan kiring.";
  }

  function doLogin(){
    var pw = byId("pw").value;
    if(!pw) return;
    var btn = byId("loginBtn");
    byId("loginErr").textContent = "";
    btn.disabled = true;
    Api.login(pw).then(function(body){
      startSession(body.role || "SUPER_ADMIN");
    }).catch(function(err){
      byId("loginErr").textContent = err.unauth ? "Parol noto'g'ri" : err.message;
    }).then(function(){ btn.disabled = false; });
  }
  byId("loginBtn").addEventListener("click", doLogin);
  byId("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  function doLogout(){
    // The cookie is HttpOnly — only the server can clear it, so this has
    // to be a real request, not a document.cookie assignment.
    Api.logout().then(function(){
      endSession(false);
      toast("Chiqdingiz");
    }).catch(function(){
      endSession(false);
      toast("Chiqdingiz (server bilan bog'lanib bo'lmadi)", "bad");
    });
  }

  /* ==========================================================
     30. Boot
     ========================================================== */
  function checkSession(){
    return Api.session().then(function(body){
      if(body.authed && body.role) startSession(body.role);
      else if(session.role) endSession(true);
      else byId("loginBox").hidden = false;
    }).catch(function(){
      if(!session.role) byId("loginBox").hidden = false;
    });
  }

  // Restoring from the back/forward cache can revive a logged-out panel;
  // re-check with the server rather than trusting what's on screen.
  window.addEventListener("pageshow", function(e){
    if(e.persisted && session.role) checkSession();
  });

  checkSession();
})();
</script>
</body>
</html>
